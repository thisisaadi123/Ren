  <script>
    // Theme before first paint: the saved choice, else the system setting.
    (function (root) {
      root.classList.add("js");
      var saved;
      try { saved = localStorage.getItem("ren-theme"); } catch (e) {}
      root.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })(document.documentElement);
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="visual.css" />
  <link rel="stylesheet" href="solution.css" />

</head>

  <!-- Loading screen: shown only if the page or the server takes a moment -->
  <div class="ren-loader">
    <div class="ren-loader-inner">
      <svg class="ren-loader-mark" aria-hidden="true"><use href="#ren-mark"/></svg>
      <span class="ren-loader-bar" aria-hidden="true"></span>
      <p class="ren-loader-tip" aria-hidden="true"></p>
      <span class="sr-only" role="status">Loading</span>
    </div>
  </div>

  <!-- Workspace bar: back to the sheet, where you are, the clock, the account -->
  <header class="ws-bar">
    <a href="app.html" class="logo ws-logo" aria-label="Ren home">
      <svg class="logo-mark" aria-hidden="true"><use href="#ren-mark"/></svg>
    </a>
    <nav class="ws-crumbs" aria-label="Breadcrumb">
      <a href="dsa.html">DSA</a>
      <span class="ws-sep" aria-hidden="true">/</span>
      <a href="dsa.html" class="ws-topic" data-topic-link></a>
      <span class="ws-sep ws-topic" aria-hidden="true">/</span>
      <b data-crumb-title aria-current="page"></b>
    </nav>
    <div class="ws-actions">
      <button type="button" class="ws-timer" data-timer aria-label="Timer. Select to pause.">00:00</button>
        <div class="account">
          <button class="account-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" aria-label="Account">
            <span class="avatar" data-initial></span>
          </button>
          <div class="account-menu" id="account-menu" role="menu" hidden>
            <div class="account-id">
              <b data-name></b>
              <span data-email></span>
            </div>
            <a href="#" role="menuitem">Settings</a>
            <button type="button" role="menuitem" data-logout>Log out</button>
          </div>
        </div>
    </div>
  </header>

  <main class="ws" id="ws" aria-busy="true">
    <!-- Laptops: problem or Ren beside the code. Phones: one pane at a time -->
    <div class="ws-switch" role="tablist" aria-label="View">
      <div class="seg" data-seg>
        <button type="button" role="tab" aria-selected="true" aria-controls="pane-prob" data-pane="prob">Problem</button>
        <button type="button" role="tab" aria-selected="false" aria-controls="pane-code" data-pane="code">Code</button>
        <button type="button" role="tab" aria-selected="false" aria-controls="pane-ren" data-pane="ren">Ren</button>
        <span class="seg-thumb"></span>
      </div>
    </div>

    <!-- Problem -->
    <section class="pane pane-prob" id="pane-prob" aria-label="Problem">
      <div class="prob-scroll">
        <div class="prob-meta" data-meta></div>
        <h1 class="prob-h" data-title></h1>
        <div class="prob-text" data-statement></div>
        <div data-examples></div>
        <div class="prob-text" data-notes></div>
        <div data-walk></div>
      </div>
    </section>

    <div class="split split-x" data-split="prob" role="separator" aria-orientation="vertical" aria-label="Resize the problem" tabindex="0"></div>

    <!-- Code: editor, test cases and results -->
    <section class="pane pane-code" id="pane-code" aria-label="Code">
      <div class="code-top">
        <span class="file-tab"><span class="dot"></span><span data-file>solution.py</span></span>
        <div class="select select-sm">
          <select data-lang aria-label="Language"></select>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <button type="button" class="ghost-btn" data-reset title="Back to the starter code">Reset</button>
      </div>

      <div class="editor" data-editor>
        <pre class="gutter" aria-hidden="true"></pre>
        <div class="code-stack">
          <pre class="code-hl" aria-hidden="true"></pre>
          <textarea class="code-input" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Code editor"></textarea>
        </div>
      </div>

      <div class="split split-y" data-split="console" role="separator" aria-orientation="horizontal" aria-label="Resize the console" tabindex="0"></div>

      <div class="console">
        <div class="console-head">
          <div class="seg" role="tablist" aria-label="Console" data-seg>
            <button type="button" role="tab" aria-selected="true" aria-controls="panel-cases" data-console="cases">Test cases</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="panel-result" data-console="result">Result</button>
            <span class="seg-thumb"></span>
          </div>
          <span class="run-line" aria-hidden="true"></span>
        </div>
        <div class="console-body">
          <div class="console-panel" id="panel-cases" role="tabpanel" data-panel="cases"></div>
          <div class="console-panel" id="panel-result" role="tabpanel" data-panel="result" aria-live="polite" hidden></div>
        </div>
      </div>

      <div class="code-foot">
        <span class="save-note" data-saved></span>
        <button type="button" class="btn btn-secondary btn-sm" data-run title="Run (Ctrl or ⌘ + Enter)">
          <span class="spinner" aria-hidden="true"></span><span>Run</span>
        </button>
        <button type="button" class="btn btn-primary btn-sm" data-submit title="Submit (Ctrl or ⌘ + Shift + Enter)">
          <span class="spinner" aria-hidden="true"></span><span>Submit</span>
        </button>
      </div>
    </section>

    <div class="split split-x" data-split="ren" role="separator" aria-orientation="vertical" aria-label="Resize Ren" tabindex="0"></div>

    <!-- Ren: chat (blank for now) and the full solution, behind a prompt -->
    <aside class="pane pane-ren" id="pane-ren" aria-label="Ren">
      <div class="ren-head">
        <svg class="logo-mark" aria-hidden="true"><use href="#ren-mark"/></svg>
        <div class="seg" role="tablist" aria-label="Ren" data-seg>
          <button type="button" role="tab" id="tab-chat" aria-selected="true" aria-controls="ren-chat" data-ren-tab="chat">Chat</button>
          <button type="button" role="tab" id="tab-solution" aria-selected="false" aria-controls="ren-solution" data-ren-tab="solution">Solution</button>
          <span class="seg-thumb"></span>
        </div>
        <button type="button" class="ghost-btn ren-widen" data-widen aria-pressed="false" title="Widen Ren's pane">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4 2 8l4 4M10 4l4 4-4 4"/></svg>
          <span class="sr-only">Widen</span>
        </button>
      </div>
      <div class="ren-body">
        <div class="ren-panel" id="ren-chat" role="tabpanel" aria-labelledby="tab-chat" data-ren-panel="chat"></div>
        <div class="ren-panel sol" id="ren-solution" role="tabpanel" aria-labelledby="tab-solution" data-ren-panel="solution" hidden></div>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
  <script src="api.js"></script>
  <script src="loader.js"></script>
  <script src="session.js"></script>
  <script src="highlight.js"></script>
  <script src="visual.js"></script>
  <script src="solution.js"></script>
  <script src="problem.js"></script>
</body>
</html>
