# Ren SQL sheet: the source of truth for topics, patterns and planned counts.
# Problems live in problems/<topic>/<pattern>/<id>/. A pattern shows its
# written problems; the rest of its count stays on the sheet, locked.
# Order is the order most people learn SQL in.
tracks:
  - { id: foundations, name: Foundations }
  - { id: core, name: Core }
  - { id: advanced, name: Advanced }

topics:
  - id: select-filter
    name: Selecting & Filtering
    track: foundations
    patterns:
      - { id: pick-columns, name: Choosing columns, count: 3, about: "SELECT the columns you need, rename them and compute new ones." }
      - { id: where-conditions, name: Filtering rows, count: 4, about: "WHERE with comparisons, AND / OR, IN, BETWEEN and LIKE." }
      - { id: null-checks, name: Missing values, count: 4, about: "IS NULL, COALESCE, and why NULL never equals anything." }

  - id: sort-limit
    name: Sorting & Limiting
    track: foundations
    patterns:
      - { id: order-by, name: Ordering results, count: 3, about: "ORDER BY one or more columns, with tie-breakers." }
      - { id: top-n, name: Top N with LIMIT, count: 4, about: "LIMIT and OFFSET to take the first rows of a sorted result." }
      - { id: distinct-values, name: Distinct values, count: 2, about: "DISTINCT to remove duplicate rows." }

  - id: aggregation
    name: Aggregation
    track: foundations
    patterns:
      - { id: aggregate-functions, name: Counting and summing, count: 3, about: "COUNT, SUM, AVG, MIN and MAX over a whole table." }
      - { id: group-by, name: Grouping, count: 4, about: "GROUP BY to get one row per group." }
      - { id: having, name: Filtering groups, count: 4, about: "HAVING keeps or drops whole groups." }

  - id: conditional
    name: Conditional Logic
    track: foundations
    patterns:
      - { id: case-when, name: CASE expressions, count: 4, about: "Turn values into labels or buckets with CASE WHEN." }
      - { id: conditional-aggregation, name: Counting by condition, count: 5, about: "SUM(CASE …) and friends to count several things in one pass." }

  - id: joins
    name: Joins
    track: core
    patterns:
      - { id: inner-join, name: Inner joins, count: 4, about: "Combine rows from two tables that match on a key." }
      - { id: left-join, name: Outer joins, count: 4, about: "LEFT JOIN keeps every row on the left, matched or not." }
      - { id: anti-join, name: Rows with no match, count: 4, about: "Find rows that have no partner in another table." }
      - { id: multi-join, name: Three or more tables, count: 3, about: "Chain joins through link tables." }
      - { id: self-join, name: Self joins, count: 3, about: "Join a table to itself: managers, pairs and neighbours." }
      - { id: cross-join, name: Every combination, count: 3, about: "CROSS JOIN builds every pair, then fill in the gaps." }
      - { id: range-join, name: Joining on a range, count: 2, about: "Join on BETWEEN: prices, tiers or bands that hold over a range." }

  - id: set-ops
    name: Set Operations
    track: core
    patterns:
      - { id: union, name: Stacking results, count: 4, about: "UNION and UNION ALL put results one under the other." }
      - { id: intersect-except, name: Common and missing rows, count: 2, about: "INTERSECT and EXCEPT compare two results." }

  - id: subqueries
    name: Subqueries
    track: core
    patterns:
      - { id: scalar-subquery, name: Comparing with one value, count: 3, about: "A subquery that returns one value, like an average." }
      - { id: in-exists, name: IN and EXISTS, count: 3, about: "Keep rows whose key appears, or doesn't, in another result." }
      - { id: correlated, name: Correlated subqueries, count: 3, about: "A subquery that runs once per outer row." }
      - { id: as-of-lookup, name: Value as of a date, count: 2, about: "The latest value on or before a given day, with a default when there is none." }

  - id: ctes
    name: Common Table Expressions
    track: core
    patterns:
      - { id: step-ctes, name: Building a query in steps, count: 4, about: "WITH names each step, so long queries read top to bottom." }

  - id: strings-dates
    name: Strings & Dates
    track: core
    patterns:
      - { id: string-functions, name: Working with text, count: 5, about: "UPPER, SUBSTR, INSTR, REPLACE, LENGTH and ||." }
      - { id: date-functions, name: Working with dates, count: 5, about: "date(), strftime() and julianday() on YYYY-MM-DD text." }
      - { id: string-aggregation, name: Joining strings in a group, count: 2, about: "GROUP_CONCAT turns a group's values into one text." }


  - id: changing-data
    name: Changing Data
    track: core
    patterns:
      - { id: update-rows, name: Updating rows, count: 3, about: "UPDATE … SET, with conditions, CASE and values from other tables." }
      - { id: delete-rows, name: Deleting rows, count: 3, about: "DELETE the rows you mean to, and keep the rest." }
      - { id: insert-upsert, name: Inserting and upserting, count: 2, about: "INSERT … SELECT, and ON CONFLICT DO UPDATE to insert or update." }
  - id: ranking
    name: "Window Functions: Ranking"
    track: advanced
    patterns:
      - { id: row-number, name: Numbering rows, count: 3, about: "ROW_NUMBER() OVER (…) numbers rows inside each group." }
      - { id: rank-dense, name: Ranks with ties, count: 3, about: "RANK and DENSE_RANK when equal values share a place." }
      - { id: top-per-group, name: Top N per group, count: 3, about: "The best few rows of every group." }

  - id: window-aggregates
    name: "Window Functions: Running Values"
    track: advanced
    patterns:
      - { id: running-totals, name: Running totals, count: 5, about: "SUM(…) OVER (ORDER BY …) adds up as it goes." }
      - { id: moving-windows, name: Moving averages, count: 3, about: "Frames like ROWS BETWEEN 2 PRECEDING AND CURRENT ROW." }
      - { id: lag-lead, name: Comparing with neighbours, count: 4, about: "LAG and LEAD read the previous or next row." }
      - { id: share-of-total, name: Share of a total, count: 2, about: "A row's part of its group's total, without a second query." }
      - { id: first-last-value, name: First, last and Nth value, count: 3, about: "FIRST_VALUE, LAST_VALUE and NTH_VALUE, and the frame that LAST_VALUE needs." }
      - { id: group-counts, name: Counts beside each row, count: 2, about: "COUNT(*) OVER (PARTITION BY …) keeps every row and adds its group's size." }

  - id: recursive
    name: Recursive Queries
    track: advanced
    patterns:
      - { id: hierarchies, name: Walking a hierarchy, count: 3, about: "WITH RECURSIVE follows parent links level by level." }
      - { id: series, name: Generating series, count: 3, about: "Build a run of numbers or dates to fill gaps." }
      - { id: graph-paths, name: Following links, count: 2, about: "Recursive walks over routes and links, with a stop on loops." }

  - id: gaps-islands
    name: Gaps & Islands
    track: advanced
    patterns:
      - { id: streaks, name: Consecutive runs, count: 5, about: "Group consecutive rows by subtracting a row number." }
      - { id: sessions, name: Grouping events into sessions, count: 2, about: "Start a new group when the gap gets too long." }
      - { id: missing-ranges, name: Finding gaps, count: 2, about: "Where a sequence skips, and by how much." }


  - id: intervals
    name: Intervals & Overlaps
    track: advanced
    patterns:
      - { id: overlap-checks, name: Overlapping ranges, count: 2, about: "Two ranges overlap when each starts before the other ends." }
      - { id: merge-ranges, name: Merging ranges, count: 2, about: "Collapse overlapping ranges into one, with a running maximum." }
      - { id: peak-concurrency, name: Most at once, count: 2, about: "Turn starts and ends into +1 / −1 events and add them up." }
  - id: reporting
    name: Reporting Patterns
    track: advanced
    patterns:
      - { id: pivot, name: Rows to columns, count: 3, about: "One column per category with conditional sums." }
      - { id: retention, name: Cohorts and retention, count: 2, about: "Group users by when they joined and follow them over time." }
      - { id: median-percentile, name: Medians and percentiles, count: 3, about: "The middle value, found with window functions." }
      - { id: dedup, name: Duplicates, count: 3, about: "Find duplicate rows, or keep only the latest of each." }

  - id: product-analytics
    name: Product Analytics
    track: advanced
    patterns:
      - { id: funnels, name: Funnels, count: 2, about: "How many users reach each step, and how many drop off." }
      - { id: experiments, name: Experiments, count: 2, about: "Compare A/B groups: conversion, averages and lift." }
      - { id: activity-metrics, name: Activity metrics, count: 2, about: "Daily and monthly actives, stickiness, first actions." }

  - id: json-data
    name: JSON Data
    track: advanced
    patterns:
      - { id: json-fields, name: Reading JSON fields, count: 2, about: "json_extract pulls values out of a JSON column." }
      - { id: json-arrays, name: Unpacking JSON arrays, count: 2, about: "json_each turns a JSON array into rows." }
