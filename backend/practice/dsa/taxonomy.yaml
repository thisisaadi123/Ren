      - { id: bounds,              name: "First/last occurrence and insert position", count: 5, about: "Lower and upper bound with duplicates" }
      - { id: rotated-array,       name: "Rotated sorted array",            count: 4, about: "Find which half is sorted, then search it" }
      - { id: peak-finding,        name: "Peak and mountain",               count: 3, about: "Follow the slope toward a local maximum" }
      - { id: matrix-search,       name: "2D matrix search",                count: 3, about: "Treat a sorted grid as one array, or walk from a corner" }
      - { id: search-on-answer,    name: "Search on the answer",            count: 8, about: "Binary search over the answer's range with a yes/no feasibility check" }
      - { id: real-valued,         name: "Real-valued and precision",       count: 3, about: "Search over decimals until the answer is within a tolerance" }
      - { id: unknown-size,        name: "Unknown size and interactive",    count: 2, about: "Find the bounds first by doubling, then search" }
      - { id: kth-element,         name: "K-th element and median",         count: 4, about: "Binary search on a value or a partition across arrays" }

  - id: linked-list
