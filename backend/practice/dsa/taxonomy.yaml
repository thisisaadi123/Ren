    track: foundations
    count: 24
    prerequisites: [arrays-hashing, two-pointers]
    patterns:
      - { id: expand-center,       name: "Expand around center",            count: 4, about: "Grow palindromes outward from each center" }
      - { id: rolling-hash,        name: "Rolling hash",                    count: 3, about: "Compare substrings in O(1) with a sliding hash" }
      - { id: pattern-matching,    name: "KMP and Z-function",              count: 3, about: "Linear-time search for a pattern and its repeats" }
      - { id: parsing-simulation,  name: "Parsing and simulation",          count: 5, about: "Tokenize, decode or format text carefully" }
      - { id: string-signature,    name: "Anagrams and signatures",         count: 3, about: "Compare strings through counts or a canonical form" }
      - { id: char-mapping,        name: "Character mapping",                count: 3, about: "Keep a one-to-one map between symbols (isomorphic strings, word patterns)" }
      - { id: palindrome-checks,   name: "Palindrome checks",                count: 3, about: "Compare from both ends, skipping or allowing one mismatch" }

  - id: sliding-window
    name: Sliding Window
    track: foundations
    count: 25
    prerequisites: [two-pointers]
    patterns:
      - { id: fixed-window,        name: "Fixed-size window",               count: 5, about: "Slide a window of length k and update the answer in O(1) per step" }
      - { id: longest-window,      name: "Longest valid window",            count: 6, about: "Grow the right edge; shrink the left only when the window breaks the rule" }
      - { id: shortest-window,     name: "Shortest valid window",           count: 5, about: "Grow until valid, then shrink as far as possible while it stays valid" }
      - { id: at-most-k,           name: "\"At most k\" counting",          count: 4, about: "Count windows with exactly k as atMost(k) - atMost(k - 1)" }
      - { id: window-frequency,    name: "Window with a frequency map",     count: 5, about: "Keep counts of what's inside the window (anagrams, distinct chars)" }

  - id: stacks-queues
    name: Stack & Queue
    track: foundations
    count: 40
    prerequisites: [arrays-hashing]
    patterns:
