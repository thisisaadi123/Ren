      - { id: fast-slow,           name: "Fast and slow pointers",          count: 5, about: "Cycles, middles and the k-th from the end" }
      - { id: list-reversal,       name: "Reversal",                        count: 5, about: "Reverse a whole list, a range, or in groups of k" }
      - { id: merge-split,         name: "Merge and split",                 count: 4, about: "Merge sorted lists, split by position or value" }
      - { id: reorder,             name: "Reorder and rearrange",           count: 4, about: "Interleave, rotate or regroup nodes in place" }
      - { id: list-arithmetic,     name: "Arithmetic on lists",              count: 3, about: "Add or compare numbers stored digit by digit, with a carry" }
      - { id: copy-with-links,     name: "Copy and intersect",               count: 2, about: "Copy lists with extra pointers, or find where two lists meet" }

