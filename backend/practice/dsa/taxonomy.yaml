      - { id: bucket-assignment,   name: "Assign to buckets",                count: 3, about: "Place each item into one of k groups, pruning equal or overfull choices" }
      - { id: meet-in-the-middle, name: "Meet in the middle", count: 2, about: "Split the items in half, enumerate each half, then combine with sorting or binary search" }

  - id: intervals
