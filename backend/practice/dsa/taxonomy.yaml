# Ren Practice: DSA taxonomy
# The single source of truth for topics, patterns and target counts.
#
# Rules:
# - Topic counts add up to `total`.
# - Pattern ids are unique across the whole file. A problem's `pattern` must be one of them.
# - A pattern `count` of null means "to be decided". It gets set when that topic's
#   batch is planned, and then a topic's pattern counts must add up to its `count`.
# - `prerequisites` are recommendations for what to do first, not locks.
# - Topics are listed in the suggested study order (the NeetCode roadmap, with
#   Sorting and Strings placed as in Striver's A2Z sheet). The app shows them in this order.

version: 1
total: 657

difficulty_mix:        # share of the whole bank, each within ±5%
  easy: 0.30
  medium: 0.50
  hard: 0.20

tracks:
  - id: foundations
    name: Foundations
  - id: core
    name: Core
  - id: advanced
    name: Advanced

topics:
  # -------------------------------------------------------------- Foundations
  - id: arrays-hashing
    name: Arrays & Hashing
    track: foundations
    count: 50
    prerequisites: []
    patterns:
      - { id: frequency-counting,  name: "Frequency counting",              count: 5, about: "Count occurrences with a hash map or a fixed-size array" }
      - { id: complement-lookup,   name: "Complement lookup",               count: 4, about: "Store what you've seen and look up what you need (target - x)" }
      - { id: group-by-key,        name: "Group by key",                    count: 4, about: "Bucket items under a canonical form (sorted letters, counts, signature)" }
      - { id: prefix-sums,         name: "Prefix sums",                     count: 6, about: "Precompute running totals to answer range or subarray-sum questions" }
      - { id: difference-arrays,   name: "Difference arrays",               count: 3, about: "Apply many range updates in O(1) each, then rebuild with one pass" }
      - { id: index-marking,       name: "In-place index marking",          count: 4, about: "Use the array itself (sign flips, swaps) as the visited set" }
      - { id: matrix-traversal,    name: "Matrix traversal",                count: 4, about: "Spiral, diagonal and rotation walks over 2D grids" }
      - { id: sort-then-scan,      name: "Sort then scan",                  count: 3, about: "Sort first so the answer appears in one linear pass" }
      - { id: prefix-suffix-products, name: "Prefix and suffix passes",         count: 3, about: "Combine a left-to-right pass with a right-to-left pass (products, running max)" }
      - { id: cyclic-sort,         name: "Cyclic sort",                      count: 3, about: "Values 1..n belong at index value - 1: swap each into place, then scan" }
      - { id: majority-vote,       name: "Majority vote",                    count: 2, about: "Boyer-Moore: cancel out pairs of different values to find what's left" }
      - { id: consecutive-runs,    name: "Consecutive runs with a set",      count: 2, about: "Start counting only at a run's first value, so each value is seen once" }
      - { id: rotate-reverse,      name: "Rotate and reverse in place",      count: 2, about: "Rotate or reorder with three reversals and O(1) extra space" }
      - { id: next-permutation, name: "Next permutation", count: 3, about: "Find the rightmost ascent, swap it with the next larger value, then reverse the suffix" }
      - { id: matrix-in-place, name: "In-place grid markers", count: 2, about: "Use the first row and column, or spare bits, as markers to update a grid in O(1) space" }

  - id: sorting
    name: Sorting
    track: foundations
    count: 18
    prerequisites: [arrays-hashing]
    patterns:
      - { id: comparison-sorts,    name: "Merge sort and quick sort",     count: 4, about: "Write the classic O(n log n) sorts yourself, and know when each one wins" }
      - { id: custom-order,        name: "Custom order",                  count: 4, about: "Sort by a rule of your own: several keys, a comparator, a derived value" }
      - { id: counting-bucket,     name: "Counting and bucket sort",      count: 3, about: "Sort small integer ranges in linear time" }
      - { id: quickselect,         name: "Quickselect",                   count: 3, about: "Find the k-th smallest in average O(n) without sorting everything" }
      - { id: merge-count,         name: "Counting while merging",        count: 4, about: "Merge sort that also counts pairs across the halves (inversions and friends)" }

  - id: two-pointers
    name: Two Pointers
    track: foundations
    count: 28
    prerequisites: [arrays-hashing]
    patterns:
      - { id: opposite-ends,       name: "Opposite ends",                   count: 7, about: "Move inward from both ends of a sorted array or a string" }
      - { id: read-write-pointers, name: "Read/write pointers",             count: 5, about: "A fast reader and a slow writer compact or filter in place" }
      - { id: k-sum,               name: "k-Sum",                           count: 5, about: "Fix some elements, then solve the rest with two pointers" }
      - { id: partition,           name: "Partition (Dutch flag)",          count: 4, about: "Split an array into regions around a pivot in one pass" }
      - { id: merge-sorted,        name: "Merge two sorted sequences",      count: 4, about: "Walk two sorted inputs together to merge, intersect or compare" }
      - { id: subsequence-check,   name: "Subsequence matching",             count: 3, about: "Walk a pattern through a longer sequence, advancing on each match" }

  - id: strings
