      - { id: monotonic-stack,     name: "Monotonic stack",                 count: 7, about: "Next greater or smaller element in one pass" }
      - { id: expression-eval,     name: "Expression evaluation",           count: 4, about: "Evaluate or convert expressions with operator and operand stacks" }
      - { id: histogram-area,      name: "Histogram and area",              count: 4, about: "Largest rectangle and water-trapping style problems" }
      - { id: monotonic-deque,     name: "Monotonic deque",                 count: 4, about: "Sliding-window max or min in O(n)" }
      - { id: queue-simulation,    name: "Queue simulation",                count: 4, about: "Model a process step by step with a queue (rounds, tickets, tasks)" }
      - { id: stack-string-building, name: "Building strings with a stack",    count: 4, about: "Push and pop characters to decode, remove duplicates or apply backspaces" }
      - { id: stack-simulation,    name: "Stack simulation",                 count: 3, about: "Let new items collide with the top of the stack (asteroids, trains)" }
      - { id: structure-emulation, name: "One structure from another", count: 3, about: "Build a queue from two stacks, a stack from a queue, or a ring buffer from an array" }
      - { id: contribution-counting, name: "Contribution technique", count: 2, about: "Count the subarrays where each element is the min or max, from its previous and next smaller bounds" }

  - id: binary-search
