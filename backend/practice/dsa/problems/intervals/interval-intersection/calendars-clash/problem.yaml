schema_version: 1
id: calendars-clash
title: "Calendars Clash"
topic: intervals
pattern: interval-intersection
tags: [intervals, two-pointers]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: calendarsClash, params: [{ name: a, type: "int[][]" }, { name: b, type: "int[][]" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Both calendars are sorted. Walk them together like a merge: when can you be sure the current event in one calendar can't clash with anything later in the other?"
  nudge: "Two pointers. Half-open events [s1, e1) and [s2, e2) clash when s1 < e2 and s2 < e1. If they don't, advance the one that ends first."
