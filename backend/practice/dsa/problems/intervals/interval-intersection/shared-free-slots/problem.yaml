id: shared-free-slots
title: "Shared Free Slots"
topic: intervals
pattern: interval-intersection
tags: [intervals, two-pointers]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: sharedSlots, params: [{ name: a, type: "int[][]" }, { name: b, type: "int[][]" }], returns: "int[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Each list is sorted and non-overlapping. When you've compared the current slot from each list, which one can you safely move past?"
  nudge: "Two pointers. The overlap of [s1, e1] and [s2, e2] is [max(s1, s2), min(e1, e2)] when that start ≤ end. Then advance whichever slot ends first."
