signature: { function: roomsNeeded, params: [{ name: meetings, type: "int[][]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Turn each meeting into two events: a room is taken at its start and freed at its end. What's the most rooms in use at once?"
  nudge: "Sort starts and ends separately. Walk the starts; before each start, free every room whose meeting ended at or before it (move the end pointer). Track the peak of rooms in use. A meeting ending at t frees its room for one starting at t."
