schema_version: 1
id: lamps-at-each-spot
title: "Lamps at Each Spot"
topic: intervals
pattern: sweep-line
tags: [intervals, binary-search, sorting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: lampsAt, params: [{ name: lamps, type: "int[][]" }, { name: spots, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A lamp lights a spot when it starts at or before the spot and ends at or after it. Counting 'started by now' minus 'ended before now' needs only two sorted lists."
  nudge: "Sort all starts and all ends. For a spot p, the lit count is (number of starts ≤ p) − (number of ends < p). Two binary searches per spot."
