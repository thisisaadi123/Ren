topic: intervals
pattern: greedy-by-end
tags: [intervals, greedy, sorting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: fewestPins, params: [{ name: posters, type: "int[][]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Look at the poster that ends first. Its pin can go anywhere inside it; where should it go to hold as many other posters as possible?"
  nudge: "Sort by end. Put a pin at the first poster's end; it holds every poster that starts at or before that point. Move on to the first poster it doesn't hold and repeat."
