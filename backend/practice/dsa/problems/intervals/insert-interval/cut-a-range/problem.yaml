schema_version: 1
id: cut-a-range
title: "Cut a Range"
topic: intervals
pattern: insert-interval
tags: [intervals]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: cutRange, params: [{ name: slots, type: "int[][]" }, { name: cut, type: "int[]" }], returns: "int[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Each slot either misses the cut entirely, or loses a middle part. What can be left of it: a piece before the cut, a piece after, or both?"
  nudge: "For each slot [s, e): if it misses [a, b), keep it. Otherwise keep [s, a) when s < a, and [b, e) when b < e. These pieces stay sorted."
