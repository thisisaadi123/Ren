id: slot-in-a-booking
title: "Slot In a Booking"
topic: intervals
pattern: insert-interval
tags: [intervals]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: slotIn, params: [{ name: bookings, type: "int[][]" }, { name: extra, type: "int[]" }], returns: "int[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The list is already sorted and non-overlapping. Which bookings come entirely before the new one, which overlap it, and which come after?"
  nudge: "Copy every booking that ends before extra starts. Then merge every booking that starts at or before extra's end into extra (min of starts, max of ends). Add the merged booking, then copy the rest."
