schema_version: 1
id: count-pattern-matches
title: "Count Pattern Matches"
topic: tries
pattern: wildcard-dictionary
tags: [trie, dfs, strings]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: countMatches, params: [{ name: words, type: "string[]" }, { name: patterns, type: "string[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Checking every word against every pattern is slow. If the words were in a trie that also counted how many words end at each node, how would one pattern be answered?"
  nudge: "Build a trie of the words with an end-count per node. For a pattern, walk a frontier of nodes: a letter keeps the matching child, a '.' expands to all children. At the end, add up the end-counts of the frontier nodes."
authors: [ren]
