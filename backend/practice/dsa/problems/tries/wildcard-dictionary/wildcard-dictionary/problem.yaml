schema_version: 1
id: wildcard-dictionary
title: "Wildcard Dictionary"
topic: tries
pattern: wildcard-dictionary
tags: [trie, design, dfs]
difficulty: medium
status: draft
version: 1
kind: design
design:
  class: WildcardDictionary
  constructor: { params: [] }
  methods:
    - { name: addWord, params: [{ name: word, type: "string" }], returns: "void" }
    - { name: search, params: [{ name: pattern, type: "string" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A plain letter follows one branch of a trie. A `.` can be any letter. What does the search do at a `.`?"
  nudge: "Store words in a trie with an end flag. Search recursively with (node, index): at a letter go to that child; at '.' try every child; at the end of the pattern succeed only if the node ends a word."
