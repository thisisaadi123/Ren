id: straight-line-words
title: "Straight-Line Words"
topic: tries
pattern: trie-grid
tags: [trie, matrix]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: straightWords, params: [{ name: board, type: "string[]" }, { name: words, type: "string[]" }], returns: "string[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "In this puzzle a word runs in a straight line. From each cell there are only eight directions; walking a trie along each one finds every word starting there at once."
  nudge: "Build a trie of the words. For every cell and each of the 8 directions, walk forward cell by cell while the trie has a child for the next letter, recording any word that ends along the way. Sort and de-duplicate at the end."
