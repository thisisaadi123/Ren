schema_version: 1
id: word-hunt
title: "Word Hunt"
topic: tries
pattern: trie-grid
tags: [trie, backtracking, matrix]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: wordHunt, params: [{ name: board, type: "string[]" }, { name: words, type: "string[]" }], returns: "string[]" }
limits: { time_ms: 2000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Searching the board once per word repeats a lot of work. If all the words were in one trie, a single walk from each cell could look for all of them at once. When can a walk stop early?"
  nudge: "Put the words in a trie. DFS from every cell, moving to unvisited up/down/left/right neighbours, and follow the trie as you go; stop as soon as the letters stop matching any word. When a node ends a word, record it and clear the flag so it isn't found twice. Prune leaf nodes as words are found to keep later searches short."
authors: [ren]
reviewed_by: []
