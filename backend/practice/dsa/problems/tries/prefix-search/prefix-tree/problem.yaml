schema_version: 1
id: prefix-tree
title: "Prefix Tree"
topic: tries
pattern: prefix-search
tags: [trie, design, strings]
difficulty: medium
status: draft
version: 1
kind: design
design:
  class: PrefixTree
  constructor: { params: [] }
  methods:
    - { name: insert, params: [{ name: word, type: "string" }], returns: "void" }
    - { name: search, params: [{ name: word, type: "string" }], returns: "bool" }
    - { name: startsWith, params: [{ name: prefix, type: "string" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Store words letter by letter so that words sharing a start share nodes. How do you tell a stored word apart from a prefix that only passes through?"
  nudge: "Each node is a map from letter to child plus an `end` flag. insert walks and creates nodes, then sets end on the last one. search walks and needs the last node to have end set; startsWith only needs the walk to succeed."
authors: [ren]
reviewed_by: []
