schema_version: 1
id: autocomplete-suggestions
title: "Autocomplete Suggestions"
topic: tries
pattern: prefix-search
tags: [trie, strings, sorting, binary-search]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: suggest, params: [{ name: products, type: "string[]" }, { name: typed, type: "string" }], returns: "string[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "After each letter you need the three smallest products with the current prefix. If the products were sorted, where would all products with a given prefix sit?"
  nudge: "Sort the products. For each prefix typed[:i], binary-search for the first product ≥ prefix; the next three products from there that still start with the prefix are the answer. (A trie that keeps the three smallest words at each node also works.)"
authors: [ren]
reviewed_by: []
