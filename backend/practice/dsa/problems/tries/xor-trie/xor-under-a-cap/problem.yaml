signature: { function: xorUnderCap, params: [{ name: nums, type: "int[]" }, { name: queries, type: "int[][]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If the queries were sorted by their cap, the set of usable numbers would only grow. What structure answers \"best XOR with x\" over the numbers added so far?"
  nudge: "Sort nums, and sort the queries by cap m (remember their original order). Sweep: insert every num ≤ m into a binary trie, then answer x by preferring the opposite bit at each level. If nothing has been inserted yet, the answer is -1."
