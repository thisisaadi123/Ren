id: best-xor-pair
title: "Best XOR Pair"
topic: tries
pattern: xor-trie
tags: [trie, bit-manipulation]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: bestXor, params: [{ name: nums, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "XOR is largest when high bits differ. For each number, going from the top bit down, can you always pick the opposite bit if some earlier number has it?"
  nudge: "Insert each number's 31 bits (top first) into a binary trie. For a number x, walk from the top bit: prefer the child with the opposite bit (that bit of the XOR becomes 1), else take the same bit. The best over all x is the answer. (A prefix-set trick bit by bit also works.)"
