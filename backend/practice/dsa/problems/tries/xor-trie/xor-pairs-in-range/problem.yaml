signature: { function: xorPairsInRange, params: [{ name: nums, type: "int[]" }, { name: low, type: "int" }, { name: high, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Counting pairs with XOR between low and high is the count with XOR < high + 1 minus the count with XOR < low. How can a trie with subtree counts answer \"how many earlier numbers v have x XOR v < limit\"?"
  nudge: "Insert numbers one at a time into a binary trie whose nodes store how many numbers pass through. Before inserting x, count earlier v with x XOR v < limit: walk the bits from the top; where limit has a 1, every v that matches x's bit there gives XOR bit 0, which is smaller, so add that child's count, then follow the other child; where limit has a 0, follow the child that keeps the XOR bit 0."
