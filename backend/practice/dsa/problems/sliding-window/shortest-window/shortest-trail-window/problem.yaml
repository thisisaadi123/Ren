schema_version: 1
id: shortest-trail-window
title: "Shortest Trail Window"
topic: sliding-window
pattern: shortest-window
tags: [strings, dynamic-programming]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: trailWindow, params: [{ name: s, type: "string" }, { name: t, type: "string" }], returns: "string" }
limits: { time_ms: 2000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "t must appear in order inside the window, but not necessarily next to each other. For a window ending at i, which start is the best one?"
  nudge: "Let start[j] be the latest index where a match of t[0..j−1] can begin, using letters up to the current position. For each i, go through j from len(t) down to 1, and where s[i] == t[j − 1] set start[j] = start[j − 1] (with start[0] = i). When start[len(t)] is set, the window from it to i is a candidate. Keep strictly shorter windows only, so ties stay leftmost."
