id: shortest-push
title: "Shortest Push"
topic: sliding-window
pattern: shortest-window
tags: [arrays]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: shortestPush, params: [{ name: gains, type: "int[]" }, { name: target, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Every gain is positive, so a longer window never has a smaller total. Once a window reaches the target, can its left edge move in?"
  nudge: "Add gains[i] to a running total. While the total is at least target, record i − left + 1 and remove gains[left], moving left forward. Each index enters and leaves once, so it's O(n). Return 0 if nothing was recorded."
