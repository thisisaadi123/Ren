hints:
  hint: "First count how many different flavours exist. Then you need the shortest window that holds that many different values."
  nudge: "Let d be the number of distinct values. Grow the window, keeping a count per value and how many values have a non-zero count. While that number equals d, record the length and remove jars[left], moving left forward."
