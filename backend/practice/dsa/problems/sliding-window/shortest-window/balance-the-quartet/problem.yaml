id: balance-the-quartet
title: "Balance the Quartet"
topic: sliding-window
pattern: shortest-window
tags: [strings, counting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: shortestFix, params: [{ name: s, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Whatever you replace can be anything, so only the letters OUTSIDE the replaced piece matter. When can the rest of the string still be balanced?"
  nudge: "Let q = n / 4. A window works when every letter's count outside it is at most q. Count all letters, then slide: adding s[i] to the window lowers its outside count. While the outside counts are all ≤ q, record the length and give s[left] back."
