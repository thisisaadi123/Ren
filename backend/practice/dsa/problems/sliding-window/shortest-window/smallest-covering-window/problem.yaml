schema_version: 1
id: smallest-covering-window
title: "Smallest Covering Window"
topic: sliding-window
pattern: shortest-window
tags: [strings, hashing]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: coverWindow, params: [{ name: s, type: "string" }, { name: t, type: "string" }], returns: "string" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Grow the window until it covers t, then shrink it from the left while it still does. How do you know, in O(1), whether the window covers t right now?"
  nudge: "Keep need[c] (how many of c are still missing) and a counter missing = len(t). Adding s[i] with need > 0 lowers missing; need[s[i]] -= 1 either way. When missing is 0, shrink from the left: record the window, then restore need[s[left]] += 1 and, if it goes above 0, missing += 1. Record only strictly shorter windows so ties keep the leftmost."
authors: [ren]
reviewed_by: []
