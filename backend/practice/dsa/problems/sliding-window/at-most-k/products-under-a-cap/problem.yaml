schema_version: 1
id: products-under-a-cap
title: "Products Under a Cap"
topic: sliding-window
pattern: at-most-k
tags: [arrays, counting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: countUnderCap, params: [{ name: factors, type: "int[]" }, { name: cap, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "All factors are at least 1, so making a window longer never shrinks its product. For a fixed right edge, which starts work?"
  nudge: "Keep the product of [left, i]. After multiplying in factors[i], divide out factors[left] and move left forward while the product is at least cap (and left ≤ i). Then every start from left to i works: add i − left + 1. If cap ≤ 1, nothing works."
