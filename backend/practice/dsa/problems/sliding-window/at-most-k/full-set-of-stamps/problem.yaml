hints:
  hint: "If the window [left, i] already has an a, a b and a c, every longer window ending at i does too. So for each right edge, how many starts work?"
  nudge: "Track the latest index of each of a, b and c. For each i, once all three have appeared, the starts that work are 0 through min(last a, last b, last c), which is min(...) + 1 starts. Add that for every i."
