schema_version: 1
id: exactly-k-odd-tickets
title: "Exactly K Odd Tickets"
topic: sliding-window
pattern: at-most-k
tags: [arrays, counting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: countOddStretches, params: [{ name: tickets, type: "int[]" }, { name: k, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Counting windows with AT MOST k odd numbers is a plain sliding window. How does that give you EXACTLY k?"
  nudge: "atMost(k): for each right edge i, shrink while the window has more than k odd numbers; every start from left to i works, so add i − left + 1. The answer is atMost(k) − atMost(k − 1)."
