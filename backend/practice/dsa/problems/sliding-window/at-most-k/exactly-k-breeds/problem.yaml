schema_version: 1
id: exactly-k-breeds
title: "Exactly K Breeds"
topic: sliding-window
pattern: at-most-k
tags: [arrays, hashing, counting]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: countBreedStretches, params: [{ name: pens, type: "int[]" }, { name: k, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Windows with AT MOST k distinct values are easy to count with one sliding window. Can two such counts give EXACTLY k?"
  nudge: "atMost(k): keep a count per value in [left, i]. While more than k values are present, drop pens[left] (deleting a value when its count hits 0). Add i − left + 1 for each i. The answer is atMost(k) − atMost(k − 1)."
authors: [ren]
