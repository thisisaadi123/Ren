schema_version: 1
id: vowel-rich-window
title: "Vowel-Rich Window"
topic: sliding-window
pattern: fixed-window
tags: [strings]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: mostVowels, params: [{ name: s, type: "string" }, { name: k, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Count the vowels in the first window, then think about what one step to the right adds and removes."
  nudge: "Keep a running vowel count. When s[i] enters the window, add 1 if it's a vowel; when s[i − k] leaves, subtract 1 if it's a vowel. The answer is the largest count you see."
