schema_version: 1
id: best-sales-week
title: "Best Sales Week"
topic: sliding-window
pattern: fixed-window
tags: [arrays]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: bestWeek, params: [{ name: sales, type: "int[]" }, { name: k, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Neighbouring windows share all but two days. What changes when the window moves one step right?"
  nudge: "Sum the first k days. Then for each next day, add it and subtract the day that just left the window, keeping the largest total seen. Start the best at the first window's total, not at 0: every total might be negative."
