version: 1
kind: function
signature: { function: mostServed, params: [{ name: customers, type: "int[]" }, { name: moody, type: "int[]" }, { name: minutes, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The customers served in good moods are fixed. The calm technique only adds the customers who would have left unhappy. Which window adds the most?"
  nudge: "Add up customers[i] wherever moody[i] is 0: they're always happy. Then slide a window of length minutes and keep the sum of customers[i] * moody[i] inside it. The answer is the base sum plus the best window."
