schema_version: 1
id: seat-the-team
title: "Seat the Team Together"
topic: sliding-window
pattern: fixed-window
tags: [arrays, circular]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: fewestSwaps, params: [{ name: seats, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If the team has t members, they will end up in some run of t seats around the table. How many swaps does a given run need?"
  nudge: "Let t be the number of 1s. A run of t seats that already holds w team members needs t − w swaps: each swap brings one member in and one outsider out. Slide a window of length t around the circle (index i % n) and keep the largest w."
