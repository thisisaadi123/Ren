id: calm-stretches
title: "Calm Stretches"
topic: sliding-window
pattern: fixed-window
tags: [arrays]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: countCalm, params: [{ name: noise, type: "int[]" }, { name: k, type: "int" }, { name: limit, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "An average of at most limit over k readings is the same as a total of at most limit × k, and totals are easy to slide."
  nudge: "Keep the total of the current k readings. Each step adds the new reading and drops the one that left. Count the windows whose total is at most limit * k. Comparing totals avoids rounding problems with averages."
