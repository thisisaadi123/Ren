schema_version: 1
id: every-word-once
title: "Every Word Once"
topic: sliding-window
pattern: window-frequency
tags: [strings, hashing]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: everyWordOnce, params: [{ name: s, type: "string" }, { name: words, type: "string[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "All words have the same length L, so a match is made of whole L-letter chunks. If you only look at starts with the same remainder mod L, the chunks line up. Can you slide a window of chunks?"
  nudge: "For each offset 0..L−1, walk s in chunks of L from that offset. Keep counts of the chunks in the window. If a chunk isn't a word, reset the window after it. If a chunk is used more times than words has it, drop chunks from the left until it isn't. When the window holds len(words) chunks, record its start. Sort the results."
authors: [ren]
reviewed_by: []
