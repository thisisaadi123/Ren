schema_version: 1
id: scrambled-copies
title: "Scrambled Copies"
topic: sliding-window
pattern: window-frequency
tags: [strings, counting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: scrambledCopies, params: [{ name: text, type: "string" }, { name: word, type: "string" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A scrambled copy of word is any window of the same length with the same letter counts. How do the counts change when the window slides by one?"
  nudge: "Keep 26 counts for word and 26 for the current window of length len(word). Sliding adds text[i] and removes text[i − len(word)]. Track how many of the 26 letters have matching counts, updating it only for the two letters that changed. Record the start whenever all 26 match."
