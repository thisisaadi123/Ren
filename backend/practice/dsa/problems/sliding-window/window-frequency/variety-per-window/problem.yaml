id: variety-per-window
title: "Variety per Window"
topic: sliding-window
pattern: window-frequency
tags: [arrays, hashing]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: varietyPerWindow, params: [{ name: items, type: "int[]" }, { name: k, type: "int" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Keep counts of the values in the current window. When does sliding one step change the number of DIFFERENT values?"
  nudge: "Use a dictionary of counts. Adding items[i] creates a new key when its count goes 0 → 1; removing items[i − k] deletes a key when its count goes 1 → 0. The number of keys is the window's variety: record it once the window has k items."
