id: repeat-within-reach
title: "Repeat Within Reach"
topic: sliding-window
pattern: window-frequency
tags: [arrays, hashing]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: repeatWithinReach, params: [{ name: codes, type: "int[]" }, { name: k, type: "int" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "For each index, you only care about the previous k codes. What structure tells you in O(1) whether a value is among them?"
  nudge: "Keep a set of the last k codes. For each i, if codes[i] is in the set, return true. Otherwise add it, and once the set covers more than k positions, remove codes[i − k]."
