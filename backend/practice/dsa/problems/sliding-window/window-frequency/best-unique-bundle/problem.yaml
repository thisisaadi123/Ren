schema_version: 1
id: best-unique-bundle
title: "Best Unique Bundle"
topic: sliding-window
pattern: window-frequency
tags: [arrays, hashing]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: bestUniqueBundle, params: [{ name: prices, type: "int[]" }, { name: k, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Slide a window of length k and keep both its total and how many prices in it are repeated. When is a window a valid bundle?"
  nudge: "Keep count[v] for the window, its sum, and dup = number of values with count ≥ 2. Adding v: if count goes 1 → 2, dup += 1. Removing v: if count goes 2 → 1, dup −= 1. A full window with dup == 0 is a candidate. Return 0 if none is."
