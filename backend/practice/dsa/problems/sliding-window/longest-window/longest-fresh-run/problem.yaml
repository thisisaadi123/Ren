id: longest-fresh-run
title: "Longest Fresh Run"
topic: sliding-window
pattern: longest-window
tags: [strings, hashing]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: longestFresh, params: [{ name: s, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "When a repeat enters the window, how far must the left edge jump? Remember where each letter was seen last."
  nudge: "Store last[c], the latest index of each letter. For each i, if s[i] was seen at or after the current left edge, move left to last[s[i]] + 1 (never backwards). Update last[s[i]] = i and the best length i − left + 1."
