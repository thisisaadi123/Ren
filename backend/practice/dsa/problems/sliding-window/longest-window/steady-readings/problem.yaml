schema_version: 1
id: steady-readings
title: "Steady Readings"
topic: sliding-window
pattern: longest-window
tags: [arrays, deque, monotonic]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: longestSteady, params: [{ name: readings, type: "int[]" }, { name: limit, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A window is steady when its largest value minus its smallest is at most limit. How can you keep a window's max and min available as both edges move?"
  nudge: "Keep two deques of indexes: one with decreasing values (front = window max) and one with increasing values (front = window min). Push each new index after popping what it beats. While max − min > limit, move left forward and pop any front index that falls out."
