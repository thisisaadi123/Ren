hints:
  hint: "A window works if it holds at most k zeros. Grow it to the right; when does the left edge have to move?"
  nudge: "Count the zeros inside [left, i]. When the count goes over k, move left forward, dropping a zero from the count when one leaves, until the count is back to k. Track the longest window."
