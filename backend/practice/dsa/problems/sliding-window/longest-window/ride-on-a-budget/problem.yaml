schema_version: 1
id: ride-on-a-budget
title: "Ride on a Budget"
topic: sliding-window
pattern: longest-window
tags: [arrays]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: longestRide, params: [{ name: fares, type: "int[]" }, { name: budget, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Every fare is positive, so adding a stop never makes the total smaller. When the total goes over budget, which end should give way?"
  nudge: "Keep the sum of fares in [left, i]. After adding fares[i], while the sum is over budget, subtract fares[left] and move left forward. Then i − left + 1 is the longest affordable ride ending at stop i."
