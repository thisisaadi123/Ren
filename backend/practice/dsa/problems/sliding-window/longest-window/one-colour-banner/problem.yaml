schema_version: 1
id: one-colour-banner
title: "One-Colour Banner"
topic: sliding-window
pattern: longest-window
tags: [strings, counting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: longestUniform, params: [{ name: s, type: "string" }, { name: k, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A window can be made one letter if everything except its most common letter can be repainted. How many repaints does a window need?"
  nudge: "Keep letter counts in the window and the highest count seen so far, maxf. While window length − maxf > k, drop the left letter. The best length is the answer. maxf never needs to go down: a smaller one can't produce a longer window."
