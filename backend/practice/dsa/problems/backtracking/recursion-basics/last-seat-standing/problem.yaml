signature: { function: lastSeat, params: [{ name: n, type: "int" }, { name: k, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "After the first person leaves, the circle has n − 1 people and the count restarts just after them. If you knew the answer for n − 1, how would you shift it?"
  nudge: "Let J(1) = 0 (0-indexed). J(n) = (J(n − 1) + k) mod n. Answer J(n) + 1. Compute it bottom-up so deep recursion isn't a problem."
