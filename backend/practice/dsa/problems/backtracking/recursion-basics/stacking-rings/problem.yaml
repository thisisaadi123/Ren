hints:
  hint: "To move the biggest ring, every smaller ring has to be out of the way, all on the spare peg."
  nudge: "move(k, from, to, spare): move k − 1 rings from → spare, move ring k from → to, then move k − 1 rings spare → to. That's 2ⁿ − 1 moves."
