schema_version: 1
id: flip-row-symbol
title: "Flip Row Symbol"
topic: backtracking
pattern: recursion-basics
tags: [recursion, bit-manipulation]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: symbolAt, params: [{ name: n, type: "int" }, { name: k, type: "long" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Row 1 is 0. Each next row replaces 0 with 01 and 1 with 10. Position k in row n comes from position ⌈k/2⌉ in row n − 1."
  nudge: "symbolAt(n, k): if n == 1 return 0. Let p = symbolAt(n − 1, (k + 1) // 2). If k is odd the symbol equals p, otherwise it's 1 − p."
