id: quick-power
title: "Quick Power"
topic: backtracking
pattern: recursion-basics
tags: [recursion, math, divide-and-conquer]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: powerMod, params: [{ name: base, type: "long" }, { name: exp, type: "long" }, { name: mod, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "base^exp = (base^(exp/2))² when exp is even. How many halvings until exp reaches 0?"
  nudge: "power(e): if e == 0 return 1 % mod. Let h = power(e // 2); h = h·h mod m; if e is odd multiply by base once more. Reduce base mod m first, and keep every product mod m so it fits in 64 bits."
