schema_version: 1
id: fair-snack-bags
title: "Fair Snack Bags"
topic: backtracking
pattern: bucket-assignment
tags: [backtracking, pruning]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: fairestSplit, params: [{ name: bags, type: "int[]" }, { name: kids, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Hand out bags one by one, trying each kid. The answer is the smallest possible 'most any kid gets'. When is a branch already no better than the best you've found?"
  nudge: "go(i): if i == n, record max(load). For each kid, give bag i, recurse, take it back. Prune when the kid's new load ≥ best. Two kids with the same load are interchangeable: only try one of them."
authors: [ren]
reviewed_by: []
