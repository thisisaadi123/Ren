schema_version: 1
id: fewest-van-trips
title: "Fewest Van Trips"
topic: backtracking
pattern: bucket-assignment
tags: [backtracking, pruning, bin-packing]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: fewestTrips, params: [{ name: boxes, type: "int[]" }, { name: capacity, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Every trip is a group of boxes whose total fits the van. Put boxes into trips one at a time — into an existing trip with room, or a new one. When is a branch hopeless?"
  nudge: "Sort boxes descending. go(i, trips): if trips ≥ best, stop. Try box i in each open trip with room (skipping trips with the same remaining room), then in a new trip. Record trips when all are placed."
