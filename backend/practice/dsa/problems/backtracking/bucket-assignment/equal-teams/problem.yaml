id: equal-teams
title: "Equal Teams"
topic: backtracking
pattern: bucket-assignment
tags: [backtracking, pruning]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: equalTeams, params: [{ name: scores, type: "int[]" }, { name: k, type: "int" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Each team must total sum / k. Place players one at a time into a team that still has room. Which choices are pointless to try twice?"
  nudge: "Sort descending so big players fail fast. For each player try each team whose load + score ≤ target; skip a team whose load equals one you already tried for this player (same situation), and stop after trying an empty team."
