hints:
  hint: "Two beads of the same colour look identical. If you place a colour in a slot once, placing an identical bead in that same slot again makes the same strings."
  nudge: "Count how many beads of each colour are left. At each slot, loop over the distinct colours (not the beads), place one if any remain, recurse, and put it back. Each distinct order is built exactly once."
