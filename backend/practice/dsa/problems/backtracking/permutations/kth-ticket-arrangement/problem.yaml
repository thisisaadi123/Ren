id: kth-ticket-arrangement
title: "Kth Ticket Arrangement"
topic: backtracking
pattern: permutations
tags: [math, factorial-number-system]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: kthArrangement, params: [{ name: n, type: "int" }, { name: k, type: "long" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Of all n! orders, how many start with 1? With 2? Can you tell which number comes first without listing any of them?"
  nudge: "Each choice for the first slot leads (n − 1)! orders. With k made 0-based, the first number is the (k // (n − 1)!)-th smallest still unused, then k %= (n − 1)! and repeat for the next slot. Use 64-bit integers: 18! is about 6.4 × 10¹⁵."
