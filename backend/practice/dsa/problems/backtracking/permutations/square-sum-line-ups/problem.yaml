version: 1
kind: function
signature: { function: squareLineUps, params: [{ name: nums, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Build the row one number at a time, and only ever place a number whose sum with the previous one is a perfect square. How do you avoid counting two rows that differ only by swapping equal numbers?"
  nudge: "Group equal values with a counter. Pre-compute which pairs of distinct values sum to a square. Recurse on (previous value, numbers left): at each step try each distinct value with copies left that pairs with the previous one. Branching over values, not positions, counts each distinct row once."
