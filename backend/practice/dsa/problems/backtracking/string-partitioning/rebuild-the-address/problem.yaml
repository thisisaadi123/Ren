schema_version: 1
id: rebuild-the-address
title: "Rebuild the Address"
topic: backtracking
pattern: string-partitioning
tags: [backtracking, strings]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: rebuildAddress, params: [{ name: digits, type: "string" }], returns: "string[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "An address has exactly four parts. Each part is 1 to 3 digits, at most 255, and has no leading zero. Try each length for the first part, then recurse."
  nudge: "go(i, parts): with 4 parts, record it if i == n. Otherwise try lengths 1–3 for the next part: skip it if it starts with 0 and is longer than 1, or is over 255. Prune when the digits left can't fill the remaining parts."
authors: [ren]
reviewed_by: []
