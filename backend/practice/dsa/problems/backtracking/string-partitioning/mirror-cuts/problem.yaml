schema_version: 1
id: mirror-cuts
title: "Mirror Cuts"
topic: backtracking
pattern: string-partitioning
tags: [backtracking, strings, palindrome]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: mirrorCuts, params: [{ name: s, type: "string" }], returns: "string[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Choose the first piece: it must be a palindrome. Then the rest of the string is the same problem again."
  nudge: "go(start, pieces): if start == n, record a copy. Otherwise for every end ≥ start where s[start..end] is a palindrome, add it, recurse from end + 1, and remove it. Sort the results at the end."
authors: [ren]
reviewed_by: []
