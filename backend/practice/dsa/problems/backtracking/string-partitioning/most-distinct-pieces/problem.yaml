schema_version: 1
id: most-distinct-pieces
title: "Most Distinct Pieces"
topic: backtracking
pattern: string-partitioning
tags: [backtracking, strings, hashing]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: mostPieces, params: [{ name: s, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Try every length for the first piece, as long as it's a piece you haven't used yet. Then do the same for the rest."
  nudge: "go(i, used): at the end, the answer is len(used). Otherwise for each j > i, if s[i:j] isn't in used, add it, recurse from j, and remove it. Prune when used + (n − i) can't beat the best so far."
