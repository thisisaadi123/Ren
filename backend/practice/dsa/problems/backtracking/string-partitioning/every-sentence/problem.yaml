schema_version: 1
id: every-sentence
title: "Every Sentence"
topic: backtracking
pattern: string-partitioning
tags: [backtracking, strings, memoization]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: everySentence, params: [{ name: text, type: "string" }, { name: words, type: "string[]" }], returns: "string[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Split off a first word that's in the list, then the rest is the same problem. Many different first choices lead to the same leftover text: remember its answer."
  nudge: "sentences(i) = every way to break text[i:]: for each word w with text.startswith(w, i), prepend w to each sentence of sentences(i + len(w)). Memoise by i, and return the empty sentence at i == n. Sort the final list."
authors: [ren]
reviewed_by: []
