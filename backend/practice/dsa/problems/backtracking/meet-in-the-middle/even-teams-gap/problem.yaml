hints:
  hint: "Each half of the list sends some players to team A. If the left half sends k players, the right half must send n − k. Group subset sums by how many players they use."
  nudge: "For each half, collect sums of team A minus team B grouped by size k. For left size k, pair with right size n − k: sort the right list and binary-search for −d to make the total difference closest to zero."
