schema_version: 1
id: closest-subset-sum
title: "Closest Subset Sum"
topic: backtracking
pattern: meet-in-the-middle
tags: [meet-in-the-middle, binary-search, sorting]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: closestSubsetSum, params: [{ name: nums, type: "int[]" }, { name: goal, type: "int" }], returns: "long" }
limits: { time_ms: 3000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "2⁴⁰ subsets is too many, but 2²⁰ is fine. Split the numbers in half and list every subset sum of each half."
  nudge: "Let A and B be the sorted subset sums of the two halves. For each a in A, binary-search B for goal − a and check the neighbours on both sides. Track the smallest |a + b − goal|."
