checker: { type: unordered }
hints:
  hint: "A mix is a multiset, so fix an order: only ever add stamps whose value is at least the last one you added."
  nudge: "Sort the values. Recurse with (start index, amount left). Try stamps[i] for i ≥ start, recursing with the same i (you may reuse it). Stop the loop as soon as a value is bigger than what's left."
