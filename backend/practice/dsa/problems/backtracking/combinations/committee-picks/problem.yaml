schema_version: 1
id: committee-picks
title: "Committee Picks"
topic: backtracking
pattern: combinations
tags: [recursion]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: committeePicks, params: [{ name: n, type: "int" }, { name: k, type: "int" }], returns: "int[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: unordered }
hints:
  hint: "Build each committee in increasing order of member number, so every group is produced exactly once."
  nudge: "Recurse with the next smallest member you may add. Try each member from there up to n, add it, recurse from member + 1, then remove it. Stop early when too few members remain to reach k."
