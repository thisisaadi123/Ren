schema_version: 1
id: numbered-tile-sums
title: "Numbered Tile Sums"
topic: backtracking
pattern: combinations
tags: [recursion, pruning]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: tileSums, params: [{ name: m, type: "int" }, { name: k, type: "int" }, { name: target, type: "int" }], returns: "int[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: unordered }
hints:
  hint: "Pick tiles in increasing order. Once you've picked some, what are the smallest and largest totals the remaining picks could still add?"
  nudge: "Recurse with (next tile, picks left, amount left). Try each tile t from next to m, recursing on t + 1. Prune when the picks left can't possibly reach the amount left: the smallest total is next + (next+1) + …, the largest uses the top tiles up to m."
authors: [ren]
reviewed_by: []
