kind: function
signature: { function: giftBundles, params: [{ name: cards, type: "int[]" }, { name: target, type: "int" }], returns: "int[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: unordered }
hints:
  hint: "Cards with equal values are interchangeable here. If you sort them, where do the repeated bundles come from?"
  nudge: "Sort the cards. Recurse with (start, amount left) and try cards[i] for i ≥ start, recursing from i + 1. Skip cards[i] when i > start and cards[i] == cards[i − 1]: that value was already tried in this slot. Break once a card exceeds what's left."
