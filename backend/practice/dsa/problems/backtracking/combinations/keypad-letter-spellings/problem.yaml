schema_version: 1
id: keypad-letter-spellings
title: "Keypad Letter Spellings"
topic: backtracking
pattern: combinations
tags: [recursion, strings]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: keypadSpellings, params: [{ name: digits, type: "string" }], returns: "string[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: unordered }
hints:
  hint: "Each digit adds one letter. Pick a letter for the first key, then solve the rest of the keys the same way."
  nudge: "Recurse on the position in digits with the letters chosen so far. For each letter printed on that key, append it and recurse; at the end, record the string. Two keys (7 and 9) carry four letters, so use a lookup table rather than arithmetic."
