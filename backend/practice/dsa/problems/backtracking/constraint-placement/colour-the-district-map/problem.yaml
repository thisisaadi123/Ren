schema_version: 1
id: colour-the-district-map
title: "Colour the District Map"
topic: backtracking
pattern: constraint-placement
tags: [graphs, graph-colouring, recursion]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: canColour, params: [{ name: n, type: "int" }, { name: borders, type: "int[][]" }, { name: m, type: "int" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Colour the districts one at a time. When a district has no colour left that differs from all of its already-coloured neighbours, what must you do?"
  nudge: "Recurse over districts 0..n−1. For district i, try each colour 0..m−1 not used by a coloured neighbour, recurse, and undo on failure. Store each border in both districts' neighbour lists."
