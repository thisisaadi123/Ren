id: queens-on-a-damaged-board
title: "Queens on a Damaged Board"
topic: backtracking
pattern: constraint-placement
tags: [n-queens, bitmask, recursion]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: countQueens, params: [{ name: n, type: "int" }, { name: holes, type: "int[][]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Every row holds exactly one queen. Go row by row, and keep track of which columns and diagonals are already under attack."
  nudge: "Recurse on the row. Keep sets (or bitmasks) of used columns, used r − c diagonals and used r + c diagonals. In row r, try every column that is free, not attacked and not a hole. Count the ways to reach row n."
