schema_version: 1
id: nine-by-nine-fill
title: "Nine-by-Nine Fill"
topic: backtracking
pattern: constraint-placement
tags: [sudoku, bitmask, recursion]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: fillGrid, params: [{ name: board, type: "char[][]" }], returns: "char[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Fill empty cells one at a time and back up when a cell has no legal digit. Which empty cell should you fill next so that you back up as rarely as possible?"
  nudge: "Keep a 9-bit mask of used digits for every row, column and box. At each step pick the empty cell with the fewest legal digits (often just one), try each of them, recurse, and undo on failure."
authors: [ren]
reviewed_by: []
