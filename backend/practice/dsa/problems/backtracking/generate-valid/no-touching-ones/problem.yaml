schema_version: 1
id: no-touching-ones
title: "No Touching Ones"
topic: backtracking
pattern: generate-valid
tags: [backtracking, strings]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: spacedStrings, params: [{ name: n, type: "int" }, { name: ones, type: "int" }], returns: "string[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Build left to right. After a 1, what must come next? And when can you stop early because the 1s you still need won't fit?"
  nudge: "go(i, last, left): place '0' always; place '1' only if the previous character isn't '1' and left > 0. Cut the branch when the remaining positions can't hold `left` spaced-out 1s: you need 2·left − 1 positions (or 2·left if the previous was a 1)."
