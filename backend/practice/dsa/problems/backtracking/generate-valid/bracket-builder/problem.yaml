schema_version: 1
id: bracket-builder
title: "Bracket Builder"
topic: backtracking
pattern: generate-valid
tags: [backtracking, strings]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: buildBrackets, params: [{ name: n, type: "int" }], returns: "string[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Build the string one character at a time. When can you add an opening bracket, and when a closing one?"
  nudge: "go(s, open, close): add '(' while open < n; add ')' only while close < open. Record s when its length is 2n. Trying '(' before ')' produces the strings already sorted."
authors: [ren]
reviewed_by: []
