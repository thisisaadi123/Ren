hints:
  hint: "A calm word uses only a, b, c and never repeats a letter twice in a row. How many calm words start with a given letter?"
  nudge: "After the first letter, every position has 2 choices, so each first letter leads to 2ⁿ⁻¹ words. Pick the block that contains k, then repeat for each later position with blocks of size 2^(remaining). Return \"\" when k > 3·2ⁿ⁻¹."
