schema_version: 1
id: best-scoring-word-set
title: "Best-Scoring Word Set"
topic: backtracking
pattern: subsets
tags: [counting, recursion, hash-map]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: bestWordSet, params: [{ name: words, type: "string[]" }, { name: tiles, type: "string" }, { name: points, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "With at most 14 words there are at most 2¹⁴ sets to try. What do you need to carry down the recursion to know whether the next word still fits?"
  nudge: "Recurse over the words with the counts of tiles still in the bag. Skip word i, or, if every letter it needs is still available, subtract its letters, add its score, recurse, and put the letters back. Take the best total over all leaves."
