schema_version: 1
id: feud-free-guest-lists
title: "Feud-Free Guest Lists"
topic: backtracking
pattern: subsets
tags: [hash-map, recursion, counting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: feudFreeLists, params: [{ name: ages, type: "int[]" }, { name: k, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Build a list guest by guest. When you consider adding someone, which ages already on the list would clash with them?"
  nudge: "Recurse over guests with a count of each age on the list. Guest i can be added only if nobody aged ages[i] − k or ages[i] + k is on it. Use counts, not a set, because two guests can share an age. Count every non-empty list at the leaves."
authors: [ren]
