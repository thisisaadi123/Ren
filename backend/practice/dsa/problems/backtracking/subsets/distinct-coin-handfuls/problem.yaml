schema_version: 1
id: distinct-coin-handfuls
title: "Distinct Coin Handfuls"
topic: backtracking
pattern: subsets
tags: [duplicates, sorting, recursion]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: coinHandfuls, params: [{ name: coins, type: "int[]" }], returns: "int[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: unordered }
hints:
  hint: "Two handfuls are the same when they hold the same number of each coin value. Sorting the coins puts equal values next to each other."
  nudge: "Sort, then at each depth try each index i ≥ start as the next coin, but skip coins[i] when i > start and coins[i] == coins[i - 1]: that value was already tried at this depth. Record the current handful at every node."
