schema_version: 1
id: gold-mine-walk
title: "Gold Mine Walk"
topic: backtracking
pattern: grid-word-search
tags: [backtracking, matrix, dfs]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: mostGold, params: [{ name: mine, type: "int[][]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Try starting from every cell with gold. From a cell, which neighbours can you step to, and what must you undo when you come back?"
  nudge: "DFS(r, c): take the gold, set the cell to 0 so the path can't revisit it, try the four neighbours that still hold gold, then restore the cell. The best total over all starts is the answer."
