schema_version: 1
id: trace-the-word
title: "Trace the Word"
topic: backtracking
pattern: grid-word-search
tags: [backtracking, matrix, dfs]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: traceWord, params: [{ name: board, type: "char[][]" }, { name: word, type: "string" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Start a search from every cell that matches the first letter. What must you undo when a path fails?"
  nudge: "DFS(r, c, i): the cell must hold word[i]. Mark it used, try the four neighbours for i + 1, then unmark it before returning. Success when i reaches the last letter."
