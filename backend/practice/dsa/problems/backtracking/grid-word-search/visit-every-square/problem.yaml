schema_version: 1
id: visit-every-square
title: "Visit Every Square"
topic: backtracking
pattern: grid-word-search
tags: [backtracking, matrix, dfs]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: tourCount, params: [{ name: floor, type: "int[][]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A path must cover every open square exactly once. How do you know, when you reach the end, that nothing was skipped?"
  nudge: "Count the open squares first. DFS from the start, marking squares as you step on them and counting steps. At the end square, it's a valid tour only if the step count equals the number of open squares. Unmark on the way back."
