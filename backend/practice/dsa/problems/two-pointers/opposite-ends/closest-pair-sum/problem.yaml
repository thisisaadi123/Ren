title: "Closest Pair Sum"
topic: two-pointers
pattern: opposite-ends
tags: [two-pointers, sorting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: closestPairSum, params: [{ name: nums, type: "int[]" }, { name: target, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "After sorting, a pair sum that's too small can only grow by moving the left pointer."
  nudge: "Sort, then walk two pointers inward, keeping the sum closest to target (the smaller sum on a tie). Move left when the sum is below target, right when above."
