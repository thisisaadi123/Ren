hints:
  hint: "Match the outermost characters first. For the leftmost character, where is its partner closest to the right end?"
  nudge: "Greedy from both ends: for word[i], find the rightmost matching character before the right pointer and bubble it to the right end, counting swaps. If the leftmost character is the unpaired middle one, move it one step toward the center instead."
