status: draft
version: 1
kind: function
signature: { function: keepAtMostTwo, params: [{ name: values, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "In a sorted list, a value may be written if it differs from the value two places back in the output."
  nudge: "Write pointer w: copy values[i] to position w whenever w < 2 or values[i] != out[w - 2]. That keeps at most two copies of each value."
