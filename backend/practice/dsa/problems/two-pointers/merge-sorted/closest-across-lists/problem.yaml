schema_version: 1
id: closest-across-lists
title: "Closest Across Two Lists"
topic: two-pointers
pattern: merge-sorted
tags: [two-pointers, arrays]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: closestAcross, params: [{ name: a, type: "int[]" }, { name: b, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Both lists are sorted. If a[i] < b[j], moving j forward only makes the gap bigger. What should move instead?"
  nudge: "Two pointers from the start: record |a[i] - b[j]|, then advance whichever pointer points at the smaller value. Stop when either list runs out. O(n + m)."
