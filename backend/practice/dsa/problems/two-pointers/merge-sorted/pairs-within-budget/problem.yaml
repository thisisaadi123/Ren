schema_version: 1
id: pairs-within-budget
title: "Pairs Within Budget"
topic: two-pointers
pattern: merge-sorted
tags: [two-pointers, counting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: countPairsWithin, params: [{ name: mains, type: "int[]" }, { name: sides, type: "int[]" }, { name: budget, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If main i with side j fits the budget, so does main i with every cheaper side."
  nudge: "Walk mains from cheapest with i, and sides from the most expensive with j. While mains[i] + sides[j] > budget, move j down. Then all j + 1 sides work with main i. O(n + m)."
