schema_version: 1
id: triples-under-a-cap
title: "Triples Under a Cap"
topic: two-pointers
pattern: k-sum
tags: [two-pointers, sorting, counting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: countTriplesBelow, params: [{ name: values, type: "int[]" }, { name: cap, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "After sorting, if a[i] + a[j] + a[k] is below the cap, so is every triple with a smaller k."
  nudge: "Sort. For each i, set j = i + 1, k = n - 1. When the sum is below cap, all k - j choices between them work: add k - j and move j up; otherwise move k down."
