hints:
  hint: "Counting sums in [low, high] is the same as counting sums at most high, minus sums at most low - 1."
  nudge: "Write countAtMost(x) with sort + two pointers (for each i, when a[i] + a[j] + a[k] <= x, add k - j and move j). The answer is countAtMost(high) - countAtMost(low - 1). O(n²)."
