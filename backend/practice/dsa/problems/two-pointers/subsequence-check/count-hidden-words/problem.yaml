schema_version: 1
id: count-hidden-words
title: "Count Hidden Words"
topic: two-pointers
pattern: subsequence-check
tags: [two-pointers, strings, hash-map]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: countHidden, params: [{ name: text, type: "string" }, { name: words, type: "string[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Checking each word against the whole text is too slow when there are many words. Can you advance all words at once while reading the text a single time?"
  nudge: "Put every word in a bucket keyed by the letter it's waiting for. For each character of text, take that letter's bucket, advance each word by one, and move it to its next letter's bucket (or count it if finished)."
authors: [ren]
reviewed_by: []
