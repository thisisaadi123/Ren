id: sort-k-colours
title: "Sort K Colours"
topic: two-pointers
pattern: partition
tags: [two-pointers, sorting, divide-and-conquer]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: sortKColours, params: [{ name: balls, type: "int[]" }, { name: k, type: "int" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "With three colours one partition pass is enough. With k colours, split the colour range in half and partition around the middle."
  nudge: "Recursively partition: for colours [lo, hi], put everything ≤ mid on the left and > mid on the right in place, then recurse on both parts with [lo, mid] and [mid + 1, hi]. O(n log k) with O(1) extra space besides recursion."
