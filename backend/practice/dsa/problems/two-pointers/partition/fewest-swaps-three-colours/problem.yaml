hints:
  hint: "Compare the row with its sorted version. A 0 sitting where a 1 belongs and a 1 sitting where a 0 belongs can be fixed with one swap."
  nudge: "Count, for each pair of colours (a, b), how many balls of colour a sit in b's region. Fix mutual pairs first: min(c[a][b], c[b][a]) swaps each. What's left forms 3-cycles, each needing 2 swaps."
