schema_version: 1
id: copy-with-shortcuts
title: "Copy With Shortcuts"
topic: linked-list
pattern: copy-with-links
tags: [linked-list, hashing]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: copyList, params: [{ name: head, type: "RandomNode" }], returns: "RandomNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Copying next pointers is easy. The trouble is that a random pointer may lead to a node you haven't copied yet. How can you find the copy of any original node in O(1)?"
  nudge: "Pass 1: create a copy of every node and remember original → copy in a hash map. Pass 2: for each original, set copy.next = map[orig.next] and copy.random = map[orig.random]. (For O(1) extra memory, weave each copy right after its original instead.)"
