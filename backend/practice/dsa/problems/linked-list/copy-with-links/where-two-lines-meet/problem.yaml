schema_version: 1
id: where-two-lines-meet
title: "Where Two Lines Meet"
topic: linked-list
pattern: copy-with-links
tags: [linked-list, two-pointers]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: meetPoint, params: [{ name: headA, type: "ListNode" }, { name: headB, type: "ListNode" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If both walkers cover the same total distance, they reach the meeting point at the same moment. How can you make the distances equal without knowing the lengths?"
  nudge: "Walk a from headA and b from headB. When a walker falls off the end, restart it at the OTHER list's head. After at most lenA + lenB steps they stand on the same node: the meeting point, or both null if the lines never meet."
authors: [ren]
reviewed_by: []
