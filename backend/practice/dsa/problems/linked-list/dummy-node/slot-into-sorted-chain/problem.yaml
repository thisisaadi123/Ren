tags: [pointers, sentinel, sorted]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: insertSorted, params: [{ name: head, type: "ListNode" }, { name: value, type: "int" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Find the last node whose value is smaller than the new one. What if there isn't one?"
  nudge: "Start from a dummy node placed before the head, move forward while the next value is smaller than `value`, then link the new node in right there. The answer is dummy.next, which covers inserting at the front."
