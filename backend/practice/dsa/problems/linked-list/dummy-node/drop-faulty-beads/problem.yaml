schema_version: 1
id: drop-faulty-beads
title: "Drop the Faulty Beads"
topic: linked-list
pattern: dummy-node
tags: [pointers, sentinel]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: removeBeads, params: [{ name: head, type: "ListNode" }, { name: bad, type: "int" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Removing a bead in the middle is easy: relink the bead before it. What is the bead before the first one?"
  nudge: "Put a dummy bead in front of the head. Walk with a pointer to the bead before the one you're looking at: if the next bead is faulty, skip it; otherwise step forward. Return dummy.next."
