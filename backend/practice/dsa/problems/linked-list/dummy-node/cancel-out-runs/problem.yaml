schema_version: 1
id: cancel-out-runs
title: "Cancel Out the Runs"
topic: linked-list
pattern: dummy-node
tags: [prefix-sums, hash-map, sentinel]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: cancelRuns, params: [{ name: head, type: "ListNode" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A run of consecutive nodes sums to zero exactly when the running total before it equals the running total at its end."
  nudge: "Build the kept list behind a dummy whose running total is 0, and map each kept node's running total to that node. When a new total is already in the map, cut everything after that node (removing their totals from the map too) and drop the new node."
authors: [ren]
reviewed_by: []
