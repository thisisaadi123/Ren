schema_version: 1
id: purge-repeated-readings
title: "Purge Repeated Readings"
topic: linked-list
pattern: dummy-node
tags: [pointers, sentinel, sorted]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: purgeRepeats, params: [{ name: head, type: "ListNode" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Since the list is sorted, equal readings sit next to each other in runs. You need to cut out a whole run, which means relinking the node before it."
  nudge: "Keep `prev` (last node known to stay, starting at a dummy) and `cur`. If `cur` starts a run of length ≥ 2, skip past the whole run and set `prev.next` to the node after it; otherwise advance `prev` to `cur`."
authors: [ren]
