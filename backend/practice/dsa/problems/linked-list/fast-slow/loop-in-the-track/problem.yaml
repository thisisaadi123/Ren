schema_version: 1
id: loop-in-the-track
title: "Loop in the Track"
topic: linked-list
pattern: fast-slow
tags: [two-pointers, cycle]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: hasLoop, params: [{ name: head, type: "ListNode" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If the track loops, a walker never reaches the end. How can you notice that without remembering every node you've passed?"
  nudge: "Send a slow pointer one step and a fast pointer two steps at a time. If there is a loop, the fast one laps the slow one and they meet; if not, the fast one reaches the end."
