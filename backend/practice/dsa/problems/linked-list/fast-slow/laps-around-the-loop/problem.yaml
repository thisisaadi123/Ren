schema_version: 1
id: laps-around-the-loop
title: "Laps Around the Loop"
topic: linked-list
pattern: fast-slow
tags: [cycle, modular-arithmetic]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: positionsAfter, params: [{ name: head, type: "ListNode" }, { name: steps, type: "long[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Steps can be astronomically large, so you can't walk them. Once you know where the loop starts and how long it is, where does step s land?"
  nudge: "Use Floyd to detect the loop, then reset one pointer to the head and step both by one to find the entry index μ; walk once round the loop to get its length λ. Record the first μ + λ values. Step s lands on index s if s < μ + λ, otherwise on μ + (s − μ) mod λ. Without a loop, s ≥ n falls off the end."
