kind: function
signature: { function: findRepeat, params: [{ name: tickets, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Treat each index as a node whose next pointer is tickets[i]. Starting from index 0, what shape must that walk eventually take, and why?"
  nudge: "Every value is between 1 and n, so the walk 0 → tickets[0] → tickets[tickets[0]] → … is a linked list with a loop, and the loop's entrance is the repeated value. Use Floyd: meet inside the loop, then move one pointer back to 0 and step both by one until they meet."
