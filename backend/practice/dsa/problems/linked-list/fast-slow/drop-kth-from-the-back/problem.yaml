schema_version: 1
id: drop-kth-from-the-back
title: "Drop the K-th From the Back"
topic: linked-list
pattern: fast-slow
tags: [two-pointers, sentinel]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: dropFromBack, params: [{ name: head, type: "ListNode" }, { name: k, type: "int" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If one pointer starts k nodes ahead of another and they move together, where is the trailing one when the leader reaches the end?"
  nudge: "Start both pointers at a dummy node in front of the head. Move the leader k steps first, then move both until the leader is on the last node. The trailer is now just before the node to remove; unlink it and return dummy.next."
