schema_version: 1
id: combine-sorted-rosters
title: "Combine Sorted Rosters"
topic: linked-list
pattern: merge-split
tags: [two-pointers, sentinel, sorted]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: combineRosters, params: [{ name: first, type: "ListNode" }, { name: second, type: "ListNode" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Both rosters are sorted, so the smallest remaining number is always at the front of one of them. How do you avoid writing a number twice?"
  nudge: "Merge with a dummy node and a tail pointer: repeatedly take the smaller front node, but only append its value when it differs from the tail's value. When one roster runs out, keep going through the other with the same check."
