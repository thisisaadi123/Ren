id: low-notes-first
title: "Low Notes First"
topic: linked-list
pattern: merge-split
tags: [pointers, sentinel, partition]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: lowFirst, params: [{ name: head, type: "ListNode" }, { name: pivot, type: "int" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Think of it as splitting the list into two lists and then joining them. What do you need to remember for each of the two lists?"
  nudge: "Keep two dummy heads with tail pointers: append each node to the 'low' list if its value is below the pivot, else to the 'high' list. Finally set high_tail.next = None, link low_tail.next to the high list's first node, and return low_dummy.next."
