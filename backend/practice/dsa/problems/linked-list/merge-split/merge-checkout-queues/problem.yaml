tags: [divide-and-conquer, sorted]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: mergeQueues, params: [{ name: queues, type: "ListNode[]" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Merging two sorted lists is easy. If you merge them one at a time into a growing result, how often does each early node get walked over?"
  nudge: "Merge in rounds: pair up the lists (0 with 1, 2 with 3, …) and merge each pair, halving the count every round. Each node takes part in about log k merges, for O(N log k) total. (A min-heap of the k current heads works too.)"
