checker: { type: exact }
hints:
  hint: "Values are spread too widely for counting. Which O(n log n) sort splits a linked list easily, merges it with pointer moves only, and never changes the order of ties?"
  nudge: "Merge sort: split the list at its middle (slow/fast pointers), sort both halves recursively, then merge them by absolute value, taking from the left half when the two are tied. Taking the left one on ties is what keeps equal distances in their original order."
