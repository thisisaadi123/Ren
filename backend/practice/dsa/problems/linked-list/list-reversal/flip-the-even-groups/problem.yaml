schema_version: 1
id: flip-the-even-groups
title: "Flip the Even Groups"
topic: linked-list
pattern: list-reversal
tags: [pointers]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: flipEvenGroups, params: [{ name: head, type: "ListNode" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Walk group by group. Before deciding whether to reverse a group, what do you need to know about it, especially the last one?"
  nudge: "For group size g = 1, 2, 3, …, first count how many nodes the group really has (the last group can be short). If that count is even, reverse exactly that many nodes after the node before the group and relink; then move to the group's last node and grow g."
