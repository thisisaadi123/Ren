schema_version: 1
id: flip-a-stretch
title: "Flip a Stretch of the Chain"
topic: linked-list
pattern: list-reversal
tags: [pointers, sentinel]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: flipStretch, params: [{ name: head, type: "ListNode" }, { name: left, type: "int" }, { name: right, type: "int" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Walk to the node just before position `left`. From there, how can you reverse exactly `right - left + 1` nodes and hook both ends back up?"
  nudge: "Use a dummy before the head and stop at `before` (position left − 1). Then, right − left times, take the node after the current first node of the stretch and move it to just after `before`. The stretch ends up reversed and still linked at both ends."
authors: [ren]
