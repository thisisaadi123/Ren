schema_version: 1
id: flip-in-batches
title: "Flip in Batches of K"
topic: linked-list
pattern: list-reversal
tags: [pointers, sentinel]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: flipBatches, params: [{ name: head, type: "ListNode" }, { name: k, type: "int" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Handle one batch at a time: check that k nodes remain, reverse exactly those k, then connect the batch to what came before and what comes after."
  nudge: "Keep `before` (the node just before the current batch, starting at a dummy). Look k nodes ahead; if you run out, stop. Otherwise reverse the k nodes with the node after the batch as the initial `prev`, set before.next to the new batch head, and move `before` to the old batch head (now its tail)."
authors: [ren]
reviewed_by: []
