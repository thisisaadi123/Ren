schema_version: 1
id: shift-the-conga-line
title: "Shift the Conga Line"
topic: linked-list
pattern: reorder
tags: [pointers, rotation]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: shiftLine, params: [{ name: head, type: "ListNode" }, { name: k, type: "int" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Moving the last dancer to the front n times gives back the same line. So how many moves really matter, and where does the line get cut?"
  nudge: "Count the length n and find the tail. Reduce k to k mod n; if it's 0 return head. Otherwise the new tail is node n − k − 1 (0-indexed): its next becomes the new head, set its next to None, and link the old tail to the old head."
