schema_version: 1
id: swap-dance-partners
title: "Swap Dance Partners"
topic: linked-list
pattern: reorder
tags: [pointers, sentinel]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: swapPartners, params: [{ name: head, type: "ListNode" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Work on two nodes at a time. Which three links change when you swap a pair, and which node do you need to hold on to so the pair can be reattached?"
  nudge: "With a dummy before the head, let `prev` be the node before the pair (a, b). Set prev.next = b, a.next = b.next, b.next = a, then move prev to a (now the second of the pair). Stop when fewer than two nodes remain."
