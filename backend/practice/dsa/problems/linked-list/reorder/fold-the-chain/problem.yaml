id: fold-the-chain
title: "Fold the Chain"
topic: linked-list
pattern: reorder
tags: [two-pointers, in-place]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: foldChain, params: [{ name: head, type: "ListNode" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The new order alternates between the front of the list and the back of the list. The back is the hard part in a singly linked list. Could you flip the back half first?"
  nudge: "Three steps: find the middle with slow/fast pointers and cut the list there; reverse the second half; then weave the two halves together, taking one node from the first half, then one from the reversed half, and so on."
