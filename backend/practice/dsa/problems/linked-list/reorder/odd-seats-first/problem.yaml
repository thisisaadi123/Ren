schema_version: 1
id: odd-seats-first
title: "Odd Seats First"
topic: linked-list
pattern: reorder
tags: [pointers, in-place]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: oddSeatsFirst, params: [{ name: head, type: "ListNode" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Build two chains as you walk: one for the 1st, 3rd, 5th … nodes and one for the 2nd, 4th … nodes. How do you link them at the end?"
  nudge: "Keep `odd` at the head and `even` at head.next, remembering evenHead. While even and even.next exist: odd.next = even.next, odd = odd.next, even.next = odd.next, even = even.next. Finally odd.next = evenHead."
