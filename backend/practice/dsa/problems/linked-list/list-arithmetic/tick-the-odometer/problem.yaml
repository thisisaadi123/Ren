version: 1
kind: function
signature: { function: tick, params: [{ name: head, type: "ListNode" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Adding one only changes a run of trailing 9s and the digit just before them. Which node is that?"
  nudge: "Put a dummy node with value 0 in front. Walk the list and remember the last node whose value isn't 9. Add 1 to it and set every node after it to 0. If the dummy was the one that changed, it becomes the new head."
