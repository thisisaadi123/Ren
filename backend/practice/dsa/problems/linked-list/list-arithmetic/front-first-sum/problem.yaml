signature: { function: addFrontFirst, params: [{ name: a, type: "ListNode" }, { name: b, type: "ListNode" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Here the biggest digit comes first, but carries move from the small end. How can you reach the ends of both lists first?"
  nudge: "Push each list's digits onto a stack (or reverse both lists). Pop from both, add with the carry, and put each result digit at the FRONT of the answer: new node, next = current head. A carry left at the end becomes one more node at the front."
