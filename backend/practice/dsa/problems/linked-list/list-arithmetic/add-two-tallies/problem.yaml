id: add-two-tallies
title: "Add Two Tallies"
topic: linked-list
pattern: list-arithmetic
tags: [linked-list, math]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: addTallies, params: [{ name: a, type: "ListNode" }, { name: b, type: "ListNode" }], returns: "ListNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The ones digits come first, so you can add the way you would on paper: right to left on paper is front to back here."
  nudge: "Walk both lists together while either has nodes left or a carry is pending. Add the two digits (0 for a list that has run out) plus the carry, append total % 10 to the answer after a dummy node, and keep total // 10 as the next carry."
