schema_version: 1
id: nearest-exit
title: "Nearest Exit"
topic: trees
pattern: tree-as-graph
tags: [trees, bfs, graphs]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: nearestExit, params: [{ name: root, type: "TreeNode" }, { name: start, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Exits are the leaves. The closest one might be below you, or above you and down another branch. How do you search both ways at once?"
  nudge: "Build an adjacency list (parent and children), then BFS from the start node. Go level by level; on the first level that contains a leaf, return the smallest leaf value on it."
