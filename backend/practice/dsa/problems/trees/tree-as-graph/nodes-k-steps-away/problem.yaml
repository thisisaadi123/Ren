schema_version: 1
id: nodes-k-steps-away
title: "Nodes K Steps Away"
topic: trees
pattern: tree-as-graph
tags: [trees, bfs, graphs]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: kAway, params: [{ name: root, type: "TreeNode" }, { name: start, type: "int" }, { name: k, type: "int" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "From the start node you can move to a child or to the parent. A tree node doesn't know its parent. What can you add first?"
  nudge: "Record every node's parent with one pass. Then BFS from the start node over three neighbours (left, right, parent), skipping visited nodes, for exactly k rounds. Sort the values in the last round."
authors: [ren]
reviewed_by: []
