schema_version: 1
id: infection-spread
title: "Infection Spread"
topic: trees
pattern: tree-as-graph
tags: [trees, bfs, graphs]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: minutesToSpread, params: [{ name: root, type: "TreeNode" }, { name: start, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Each minute the infection reaches every neighbour: parent and children. So the answer is the distance from start to the farthest node. How do you go upward?"
  nudge: "Record parents (or build an adjacency list), then BFS from the start node, one level per minute. The number of levels after the first is the answer."
