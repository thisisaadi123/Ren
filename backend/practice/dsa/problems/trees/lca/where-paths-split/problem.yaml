schema_version: 1
id: where-paths-split
title: "Where the Paths Split"
topic: trees
pattern: lca
tags: [trees, recursion]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: splitPoint, params: [{ name: root, type: "TreeNode" }, { name: p, type: "int" }, { name: q, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Walk down from the root towards p and towards q. The last node both walks share is the answer. Can a single post-order pass find it without storing paths?"
  nudge: "Recursively: return the node if it's p or q; otherwise ask both children. If both sides found something, this node is where the paths split. If only one side did, pass that result up. (Or record every node's parent with a BFS, mark p's ancestors, and walk up from q until you hit a marked node.)"
authors: [ren]
reviewed_by: []
