schema_version: 1
id: ancestor-or-none
title: "Ancestor or None"
topic: trees
pattern: lca
tags: [trees, recursion]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: commonOrNone, params: [{ name: root, type: "TreeNode" }, { name: p, type: "int" }, { name: q, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The usual common-ancestor trick returns p as soon as it sees p, without checking that q exists. How can you make sure both were really found?"
  nudge: "Do one full post-order pass that counts how many of p and q each subtree contains. The first node (lowest) whose count reaches 2 is the answer. If the root's count is below 2, one of them is missing: return -1."
