title: "Deepest Leaves' Ancestor"
topic: trees
pattern: lca
tags: [trees, recursion]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: deepestAncestor, params: [{ name: root, type: "TreeNode" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Let each subtree report two things: how deep its deepest node is, and the lowest node that covers all of those deepest nodes. How does a parent combine its children's reports?"
  nudge: "Post-order: for a missing child return (depth 0, none). At a node with left (dl, a) and right (dr, b): if dl > dr return (dl + 1, a); if dr > dl return (dr + 1, b); if they're equal, this node covers both sides: return (dl + 1, node)."
