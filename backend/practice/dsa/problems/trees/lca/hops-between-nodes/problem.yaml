version: 1
kind: function
signature: { function: hops, params: [{ name: root, type: "TreeNode" }, { name: p, type: "int" }, { name: q, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The shortest route between two nodes goes up to their lowest common ancestor and back down. How long is each part?"
  nudge: "Find every node's depth and parent with one BFS. Find the lowest common ancestor a of p and q (walk the deeper one up, then both together). The answer is depth[p] + depth[q] − 2 · depth[a]."
