hints:
  hint: "Walk the tree once and write down when you enter each node and when you leave it. What do those two times look like for a node and someone in its branch?"
  nudge: "Give every node an entry time (pre-order counter) and an exit time (the last entry time inside its subtree). a is above b exactly when tin[a] < tin[b] ≤ tout[a]. Each query is then O(1)."
