hints:
  hint: "Number the nodes in pre-order. Which positions does one node's whole branch occupy?"
  nudge: "In pre-order, a subtree is one contiguous block [tin, tout]. Keep a Fenwick tree over those positions: an add is a point update at tin[v], a report is the range sum over [tin[v], tout[v]]. Both are O(log n)."
