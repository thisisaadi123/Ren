hints:
  hint: "The finished spine lists the nodes in pre-order. Where does a node's right branch have to be reattached once its left branch moves over to the right?"
  nudge: "For each node with a left child, find the rightmost node of that left subtree, hang the node's right subtree there, move the left subtree to the right and clear the left pointer. Every node is walked over O(1) times in total."
