schema_version: 1
id: best-trail-anywhere
title: "Best Trail Anywhere"
topic: trees
pattern: tree-dp
tags: [trees, dynamic-programming, recursion]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: bestTrail, params: [{ name: root, type: "TreeNode" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Any trail has one highest node where it bends. At that node, the trail is the node plus the best downward run on each side, but only the sides that help. What should a node report upward?"
  nudge: "Post-order: gain(n) = n.val + max(0, gain(left), gain(right)) is the best downward run starting at n. While visiting n, also try n.val + max(0, gain(left)) + max(0, gain(right)) as a full trail. Start the best at the root's value, not at 0, since every value may be negative."
