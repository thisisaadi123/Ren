hints:
  hint: "For each tree, you either pick it or you don't. If you pick it, its children are off limits. What should each subtree report to its parent?"
  nudge: "Return a pair from every node: (best if this tree is picked, best if it isn't). Picked = val + skip(left) + skip(right). Not picked = max(both of left) + max(both of right). The answer is the max of the root's pair."
