hints:
  hint: "A zigzag that just went left must go right next. What should you carry down so a child knows how long the zigzag reaching it already is?"
  nudge: "Walk the tree carrying (direction you arrived from, length). Going to the opposite side extends the walk: length + 1. Going the same way starts a new walk of length 1. Track the largest length seen. Start at the root with length 0."
