kind: function
signature: { function: fewestCameras, params: [{ name: root, type: "TreeNode" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A camera on a leaf watches less than a camera on that leaf's parent. Work from the bottom up: what states can a node be in after its children are settled?"
  nudge: "Post-order with three states: 0 = not watched yet, 1 = has a camera, 2 = watched without a camera. A missing child counts as 2. If any child is 0, put a camera here (state 1). Else if any child is 1, this node is 2. Else it's 0. If the root ends in state 0, add one more camera."
