status: draft
version: 1
kind: function
signature: { function: coinMoves, params: [{ name: root, type: "TreeNode" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Look at one edge between a node and its parent. How many coins must cross it, whichever way, once everything is settled?"
  nudge: "Post-order: let extra(n) = coins in n's subtree − nodes in n's subtree. Exactly |extra(n)| coins cross the edge above n. Return extra(n) = n.val − 1 + extra(left) + extra(right), and add |extra(left)| + |extra(right)| to the answer at each node."
