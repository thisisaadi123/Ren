schema_version: 1
id: tree-outline
title: "Tree Outline"
topic: trees
pattern: tree-views
tags: [trees, dfs]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: outline, params: [{ name: root, type: "TreeNode" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Split the outline into four parts: the root, the left edge going down, the leaves from left to right, and the right edge going up. Which nodes belong to each, and which must not be listed twice?"
  nudge: "Left edge: start at root.left; repeatedly step to the left child if there is one, else the right child; stop before a leaf. Leaves: a pre-order walk (left first) of everything below the root. Right edge: the same from root.right preferring right children, then reverse it. A lone root is just [root]."
authors: [ren]
