schema_version: 1
id: column-readout
title: "Column Readout"
topic: trees
pattern: tree-views
tags: [trees, sorting, hashing]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: columnReadout, params: [{ name: root, type: "TreeNode" }], returns: "int[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Every node gets a (column, row) position: root (0, 0), left child (col − 1, row + 1), right child (col + 1, row + 1). How should nodes that share a column and a row be ordered?"
  nudge: "Collect (column, row, value) for every node with a BFS or DFS. Sort by column, then row, then value. Then group consecutive entries by column."
