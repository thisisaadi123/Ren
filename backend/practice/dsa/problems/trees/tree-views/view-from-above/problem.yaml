schema_version: 1
id: view-from-above
title: "View From Above"
topic: trees
pattern: tree-views
tags: [trees, bfs, hashing]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: topView, params: [{ name: root, type: "TreeNode" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Give each node a column: the root is 0, a left child is one less, a right child one more. Looking down, which node of each column do you see?"
  nudge: "BFS from the root carrying each node's column. The first node a BFS meets in a column is the highest one there (ties at the same depth go to the one further left, which BFS meets first). Record it if the column is new, then output columns from smallest to largest."
