version: 1
kind: function
signature: { function: totalsFromTop, params: [{ name: root, type: "TreeNode" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "In a search tree, the values larger than a node are the ones a reverse in-order walk (right, node, left) visits before it."
  nudge: "Walk right-node-left and keep a running sum: add each value to it and write the sum back into the node. For O(1) extra memory, use Morris threads on the mirror: thread each node's in-order successor through the leftmost node of its right subtree."
