id: upside-down-tree
title: "Upside-Down Tree"
topic: trees
pattern: pointer-rewiring
tags: [trees, pointers]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: upsideDown, params: [{ name: root, type: "TreeNode" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "In this tree every right child is a leaf with a left sibling. Walk down the left edge: when a node is flipped, what do its left child, its right child and the node itself become?"
  nudge: "Walk down the left edge keeping prev (the node above) and prevRight (its old right child). For each node: remember its left child, then set node.left = prevRight and node.right = prev. Move on. The last node on the left edge is the new root. Clear the old root's children first."
