hints:
  hint: "An in-order walk of a search tree visits values from smallest to largest. If you visit nodes in that order, which pointers do you change?"
  nudge: "Walk in order with a stack (or Morris threads), keeping the last node you placed. For each visited node: set node.left = None, set last.right = node, and make it the new last. Start with a dummy node so the first step is the same as the rest."
