signature: { function: threadedInorder, params: [{ name: root, type: "TreeNode" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "To come back up from a left subtree without a stack, the subtree's last node needs a way back to its parent. Which pointer in that last node is always empty?"
  nudge: "Morris traversal: at cur, if there's no left child, record cur and go right. Otherwise find the rightmost node of cur.left (the predecessor). If its right pointer is empty, point it at cur and go left. If it already points at cur, you've finished the left side: clear it, record cur and go right."
