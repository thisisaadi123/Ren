schema_version: 1
id: flatten-to-a-chain
title: "Flatten to a Chain"
topic: trees
pattern: pointer-rewiring
tags: [trees, linked-list, pointers]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: flatten, params: [{ name: root, type: "TreeNode" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The chain must follow pre-order. Where should a node's left subtree go so that it comes right after the node and before the right subtree?"
  nudge: "Walk down the right pointers with cur. If cur has a left child, find the rightmost node of that left subtree, hook cur.right onto it, move the left subtree to cur.right, and set cur.left to None. Then step to cur.right. No stack needed."
