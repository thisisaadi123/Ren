schema_version: 1
id: shared-ancestor-queries
title: "Shared Ancestor Queries"
topic: trees
pattern: binary-lifting
tags: [trees, binary-lifting, lca]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: sharedAncestors, params: [{ name: parent, type: "int[]" }, { name: queries, type: "int[][]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Walking both nodes up one step at a time is O(depth) per query, too slow on a long chain. With 2^j-th ancestors precomputed, how do you first even out the depths, then climb both together?"
  nudge: "Compute depths and up[j][v]. For (u, v): lift the deeper one by the depth difference using its bits. If they're now equal, that's the answer. Otherwise, for j from high to low, if up[j][u] != up[j][v], jump both. The answer is then parent[u]."
