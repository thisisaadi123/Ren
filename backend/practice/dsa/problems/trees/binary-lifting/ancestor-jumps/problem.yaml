id: ancestor-jumps
title: "Ancestor Jumps"
topic: trees
pattern: binary-lifting
tags: [trees, binary-lifting, dynamic-programming]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: ancestorJumps, params: [{ name: parent, type: "int[]" }, { name: queries, type: "int[][]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Walking up k steps one at a time is too slow when there are many queries on a long chain. Any k is a sum of powers of two. What if every node knew its 1st, 2nd, 4th, 8th… ancestor?"
  nudge: "Let up[j][v] be v's 2^j-th ancestor (−1 if none): up[0] = parent, and up[j][v] = up[j−1][up[j−1][v]]. For a query (v, k), for each bit j set in k, jump v = up[j][v], stopping at −1. That's O(log n) per query."
