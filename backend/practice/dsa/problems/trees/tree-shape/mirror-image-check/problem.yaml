schema_version: 1
id: mirror-image-check
title: "Mirror Image Check"
topic: trees
pattern: tree-shape
tags: [trees, recursion]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: isMirror, params: [{ name: root, type: "TreeNode" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A tree is a mirror of itself when its left subtree is the mirror image of its right subtree. What does it mean for two subtrees to mirror each other?"
  nudge: "Compare pairs (x, y): both missing is fine; one missing or different values isn't. Otherwise compare x.left with y.right and x.right with y.left. Start with (root.left, root.right)."
