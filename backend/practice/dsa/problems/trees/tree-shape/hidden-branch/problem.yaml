checker: { type: exact }
hints:
  hint: "The branch has to match a node of root together with EVERYTHING below that node. For which nodes of root is it worth running a full comparison?"
  nudge: "Write same(x, y) that checks two trees are identical. Then visit every node of root and return true if same(node, branch) holds for any of them. That's O(n · m), which is fine for these sizes."
