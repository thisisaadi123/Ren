schema_version: 1
id: flip-equivalent
title: "Flip-Equivalent Trees"
topic: trees
pattern: tree-shape
tags: [trees, recursion]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: flipEquivalent, params: [{ name: a, type: "TreeNode" }, { name: b, type: "TreeNode" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "At each node you may swap the children or not. Values are distinct, so which child of b should a.left be compared with?"
  nudge: "Compare (x, y): both missing → true; one missing or different values → false. Otherwise the children must match either straight (x.left~y.left and x.right~y.right) or crossed (x.left~y.right and x.right~y.left). With distinct values, match by the children's values to avoid trying both."
authors: [ren]
reviewed_by: []
