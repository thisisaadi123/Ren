hints:
  hint: "Collect each floor left to right as usual. What do you do differently to every second floor?"
  nudge: "Plain BFS level by level; reverse the list of every odd-numbered floor before adding it to the answer. Don't try to change the order children are enqueued in: that scrambles the floors below."
