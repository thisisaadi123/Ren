signature: { function: cousinSums, params: [{ name: root, type: "TreeNode" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A node's cousins are everyone on its floor except itself and its sibling. What single floor-wide number helps?"
  nudge: "Go floor by floor. First total the whole next floor; then, for each parent, give both of its children (floor total − the two siblings' combined value). Finish the totals before overwriting any value."
