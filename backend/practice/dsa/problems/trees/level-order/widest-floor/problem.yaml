hints:
  hint: "Number the positions on each floor as if every floor were completely filled. What are the numbers of a node's two children?"
  nudge: "A node at position p has children at 2p and 2p + 1. BFS by floor; the floor's width is last − first + 1. Subtract the floor's first position before going down so the numbers stay small."
