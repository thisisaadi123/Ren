id: average-per-floor
title: "Average per Floor"
topic: trees
pattern: level-order
tags: [bfs, queue]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: floorAverages, params: [{ name: root, type: "TreeNode" }], returns: "double[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: float, tolerance: 1e-5 }
hints:
  hint: "Handle the tree one floor at a time. How do you know where one floor ends in the queue?"
  nudge: "BFS with a queue: at the start of each round the queue holds exactly one floor. Sum those values (in a 64-bit total), divide by the count, and enqueue their children for the next round."
