schema_version: 1
id: exact-trail-sum
title: "Exact Trail Sum"
topic: trees
pattern: root-to-leaf
tags: [dfs, path-sum]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: hasTrailSum, params: [{ name: root, type: "TreeNode" }, { name: target, type: "int" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Walk down carrying how much of the target is still left. Where are you allowed to check it?"
  nudge: "DFS with the remaining amount (target − running sum). Only at a leaf (no children at all) compare it with 0. Values can be negative, so never stop early because the sum got too big."
