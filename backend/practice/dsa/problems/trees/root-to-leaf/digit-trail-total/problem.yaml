schema_version: 1
id: digit-trail-total
title: "Digit Trail Total"
topic: trees
pattern: root-to-leaf
tags: [dfs, modular-arithmetic]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: digitTrailTotal, params: [{ name: root, type: "TreeNode" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If the digits so far spell the number x, what number do they spell after one more digit d?"
  nudge: "Carry the number down: child value = (x · 10 + d) mod 1 000 000 007. Add it to the answer only at leaves. Taking the remainder at every step keeps the numbers small without changing the final result."
