schema_version: 1
id: smallest-leaf-word
title: "Smallest Leaf Word"
topic: trees
pattern: root-to-leaf
tags: [dfs, strings, backtracking]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: smallestLeafWord, params: [{ name: root, type: "TreeNode" }], returns: "string" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Choosing the smaller child at each step looks tempting. Why can that fail when the word is read from the leaf end?"
  nudge: "Carry the path down. At each leaf, build the word from the leaf up to the root and keep the smallest seen. The decision depends on the whole word, so compare complete words, not first letters."
authors: [ren]
reviewed_by: []
