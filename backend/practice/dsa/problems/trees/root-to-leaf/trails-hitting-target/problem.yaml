tags: [dfs, backtracking, path-sum]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: trailsWithSum, params: [{ name: root, type: "TreeNode" }, { name: target, type: "int" }], returns: "int[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Keep one list for the path you're on. When you reach a qualifying leaf, what exactly do you add to the answer?"
  nudge: "Backtracking DFS: push the value, recurse left then right, pop. At a leaf whose running sum equals the target, append a copy of the current path (not the list itself, which keeps changing)."
