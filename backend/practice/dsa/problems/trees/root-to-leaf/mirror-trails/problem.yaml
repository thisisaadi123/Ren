schema_version: 1
id: mirror-trails
title: "Mirror Trails"
topic: trees
pattern: root-to-leaf
tags: [dfs, hashing, palindrome]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: mirrorTrails, params: [{ name: root, type: "TreeNode" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Checking each trail from scratch costs its full length, and a comb-shaped tree has many long trails. What could you carry down so the check at a leaf is O(1)?"
  nudge: "Carry two polynomial hashes of the path: one reading forward (add v · Bᵈ at depth d) and one reading backward (multiply by B, then add v). A trail reads the same both ways exactly when the two hashes match (use a large modulus such as 2⁶¹ − 1)."
authors: [ren]
reviewed_by: []
