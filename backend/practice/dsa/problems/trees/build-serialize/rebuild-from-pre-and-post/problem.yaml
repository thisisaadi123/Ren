schema_version: 1
id: rebuild-from-pre-and-post
title: "Rebuild From Both Ends"
topic: trees
pattern: build-serialize
tags: [trees, divide-and-conquer]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: rebuildPrePost, params: [{ name: preorder, type: "int[]" }, { name: postorder, type: "int[]" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: custom }
hints:
  hint: "preorder[0] is the root, and preorder[1] is the root of the first child's subtree. Where does that child's subtree end in the post-order walk?"
  nudge: "Map values to post-order indexes. For a range: root = pre[lo]; if there's more, the left child is pre[lo + 1], and its subtree has size = post_index[pre[lo + 1]] − post_lo + 1. Build the left from those, the right from the rest. When a node has one child the walks can't tell left from right, so any choice is fine."
authors: [ren]
reviewed_by: []
