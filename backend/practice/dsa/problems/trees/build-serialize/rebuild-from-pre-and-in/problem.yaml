schema_version: 1
id: rebuild-from-pre-and-in
title: "Rebuild From Two Walks"
topic: trees
pattern: build-serialize
tags: [trees, divide-and-conquer, hashing]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: rebuild, params: [{ name: preorder, type: "int[]" }, { name: inorder, type: "int[]" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The first value of the pre-order walk is the root. Where does the root sit in the in-order walk, and what does that tell you about the two subtrees?"
  nudge: "Map each value to its index in inorder. Build(pre_lo, in_lo, in_hi): root = preorder[pre_lo]; m = index[root]; the left subtree has m − in_lo nodes and starts at pre_lo + 1, the right subtree starts after them. The map makes each step O(1), so the whole build is O(n)."
authors: [ren]
