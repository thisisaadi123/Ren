schema_version: 1
id: rebuild-from-in-and-post
title: "Rebuild From the Last Walk"
topic: trees
pattern: build-serialize
tags: [trees, divide-and-conquer, hashing]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: rebuildPost, params: [{ name: inorder, type: "int[]" }, { name: postorder, type: "int[]" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "In a post-order walk the root comes LAST. If you read post-order from the end, which subtree do you meet first?"
  nudge: "Map values to their in-order indexes. Read postorder from the back: each value is the root of the current range [lo, hi]. Build the RIGHT subtree (m + 1..hi) before the left (lo..m − 1), because that's the order the reversed post-order gives them."
