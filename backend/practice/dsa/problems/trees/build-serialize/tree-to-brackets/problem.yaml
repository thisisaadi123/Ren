schema_version: 1
id: tree-to-brackets
title: "Tree to Brackets"
topic: trees
pattern: build-serialize
tags: [trees, strings, recursion]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: toBrackets, params: [{ name: root, type: "TreeNode" }], returns: "string" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Write the node, then each child in parentheses. When can a pair of empty parentheses be left out without losing information?"
  nudge: "For a node: its value, then \"(left)\" if it has a left child, then \"(right)\" if it has a right child. If there's a right child but no left child, you must still write \"()\" for the missing left one, or the right child would be read as a left child."
