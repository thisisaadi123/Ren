schema_version: 1
id: tree-from-brackets
title: "Tree From Brackets"
topic: trees
pattern: build-serialize
tags: [trees, strings, stack]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: fromBrackets, params: [{ name: s, type: "string" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Read a number, then up to two bracketed groups: the first is the left child, the second the right. A stack of open nodes tells you whose child the next number is."
  nudge: "Scan s. On a number (with an optional minus sign), make a node; if the stack isn't empty, attach it as the top's left child if that's free, else as its right child; push it. On ')', pop. The first node made is the root."
