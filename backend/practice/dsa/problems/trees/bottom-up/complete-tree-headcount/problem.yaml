title: "Complete Tree Headcount"
topic: trees
pattern: bottom-up
tags: [recursion, complete-tree, binary-search]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: countNodes, params: [{ name: root, type: "TreeNode" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "In a complete tree, compare how far you can go down the far-left edge with how far you can go down the far-right edge. What do you know when they match?"
  nudge: "If the leftmost and rightmost depths are equal, the subtree is perfect: 2ʰ − 1 nodes. Otherwise count = 1 + count(left) + count(right), and only one of the two recursive calls is not perfect, giving O(log² n)."
