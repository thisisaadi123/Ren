id: longest-walk-across
title: "Longest Walk Across"
topic: trees
pattern: bottom-up
tags: [recursion, diameter, post-order]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: longestWalk, params: [{ name: root, type: "TreeNode" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The longest walk bends at some highest node. If you knew the heights of that node's two branches, how long would the walk be?"
  nudge: "One post-order pass: each call returns its subtree's height in edges plus one, and updates a global best with left height + right height. The best bend is often not the root."
