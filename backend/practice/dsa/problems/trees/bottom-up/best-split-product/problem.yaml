hints:
  hint: "Cutting the link above a node separates exactly that node's subtree. What are the two totals then?"
  nudge: "Total all values once. In a post-order pass every subtree sum s gives a candidate s · (total − s). Take the maximum of the real products first, and only then reduce it modulo 10⁹ + 7."
