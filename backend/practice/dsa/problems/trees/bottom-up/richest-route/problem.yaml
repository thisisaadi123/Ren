schema_version: 1
id: richest-route
title: "Richest Route"
topic: trees
pattern: bottom-up
tags: [recursion, post-order, path-sum]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: richestRoute, params: [{ name: root, type: "TreeNode" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Any route has one highest node where it bends. At that node, which parts of the left and right branches are worth taking?"
  nudge: "Post-order: each call returns the best downward gain starting at the node, node.val + max(0, left gain, right gain). At every node update the answer with node.val + max(0, left gain) + max(0, right gain). The answer may be negative."
