schema_version: 1
id: downward-paths-to-target
title: "Downward Paths to a Target"
topic: trees
pattern: any-path-sums
tags: [trees, prefix-sums, hashing]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: countPaths, params: [{ name: root, type: "TreeNode" }, { name: target, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A downward path from u to v has sum prefix(v) − prefix(parent of u), where prefix is the sum from the root. While at v, which earlier prefixes on the current root path would give exactly target?"
  nudge: "DFS keeping a count of prefix sums on the current root-to-node path, starting with {0: 1}. At each node with prefix s, add count[s − target] to the answer, then count[s] += 1, visit the children, and count[s] −= 1 on the way back so other branches don't see it."
authors: [ren]
reviewed_by: []
