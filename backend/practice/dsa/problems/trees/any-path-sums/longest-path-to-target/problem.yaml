schema_version: 1
id: longest-path-to-target
title: "Longest Path to a Target"
topic: trees
pattern: any-path-sums
tags: [trees, prefix-sums, hashing]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: longestPath, params: [{ name: root, type: "TreeNode" }, { name: target, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "For a path ending at the current node, the longest one starts as high up as possible. For each prefix sum on the current root path, which occurrence do you want to remember?"
  nudge: "Keep, for each prefix sum on the current root-to-node path, the SHALLOWEST depth where it appears (start with {0: 0}). At a node at depth d with prefix s, if s − target is stored at depth e, a path of d − e nodes ends here. Store s only if it isn't there yet, and remove it when you leave the node that stored it."
authors: [ren]
