id: paths-divisible-by-k
title: "Paths Divisible by K"
topic: trees
pattern: any-path-sums
tags: [trees, prefix-sums, math]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: divisiblePaths, params: [{ name: root, type: "TreeNode" }, { name: k, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A path's sum is a difference of two prefix sums from the root. When is a difference divisible by k?"
  nudge: "Two prefix sums give a sum divisible by k exactly when they leave the same remainder mod k. DFS with counts of prefix remainders on the current root path (start with {0: 1}); at each node add count[s % k], then add its own remainder, and remove it when you leave."
