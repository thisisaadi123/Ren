design:
  class: RecentFilesCache
  constructor: { params: [{ name: capacity, type: int }] }
  methods:
    - { name: open, params: [{ name: fileId, type: int }], returns: int }
    - { name: save, params: [{ name: fileId, type: int }, { name: size, type: int }], returns: void }
