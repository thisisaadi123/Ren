schema_version: 1
id: charging-stations
title: "Charging Stations"
topic: binary-search
pattern: real-valued
tags: [greedy-check, precision]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: smallestMaxGap, params: [{ name: stations, type: "int[]" }, { name: extra, type: "int" }], returns: "double" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: float, tolerance: 1e-06 }
hints:
  hint: "Guess a gap D. For each existing gap g, how many new stations does it need so that no piece is longer than D?"
  nudge: "A gap g needs ceil(g / D) - 1 new stations. Binary search D over real numbers: if the total needed is at most `extra`, D is achievable, so try smaller."
