kind: function
signature: { function: mountainTop, params: [{ name: elevations, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "On a mountain, every point is either on the way up or on the way down. Which one is mid on?"
  nudge: "If elevations[mid] < elevations[mid + 1] you're still climbing, so the top is to the right; otherwise it's at mid or to the left."
