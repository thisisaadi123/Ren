schema_version: 1
id: kth-in-sorted-grid
title: "K-th in a Sorted Grid"
topic: binary-search
pattern: matrix-search
tags: [matrix, search-on-answer]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: kthInGrid, params: [{ name: grid, type: "int[][]" }, { name: k, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Instead of searching for a position, search for a value. For a candidate value v, can you count how many cells are ≤ v quickly?"
  nudge: "Binary search v between grid[0][0] and grid[n-1][n-1]. Count cells ≤ v with a staircase walk from the bottom-left in O(n). The smallest v with count ≥ k is the answer."
authors: [ren]
reviewed_by: []
