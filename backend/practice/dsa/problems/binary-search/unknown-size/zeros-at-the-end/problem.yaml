title: "Zeros at the End"
topic: binary-search
pattern: unknown-size
tags: [math, exponential-search]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: smallestWithZeros, params: [{ name: zeros, type: "long" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The number of trailing zeros of n! never decreases as n grows, and you can compute it fast: count the factors of 5."
  nudge: "z(n) = n//5 + n//25 + n//125 + …. Double hi until z(hi) ≥ zeros, then binary search the smallest n. Some counts are skipped (no factorial ends in exactly 5 zeros), which is why the question asks for at least `zeros`."
