id: stack-of-cans
title: "Stack of Cans"
topic: binary-search
pattern: unknown-size
tags: [math, exponential-search]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: rowsNeeded, params: [{ name: cans, type: "long" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A stack with r rows holds 1 + 2 + … + r cans. You don't know how many rows you'll need, so how do you find a safe upper bound quickly?"
  nudge: "Double hi (1, 2, 4, 8, …) until hi rows hold at least `cans`. Then binary search between hi / 2 and hi for the smallest r with r(r + 1)/2 ≥ cans."
