schema_version: 1
id: kth-of-two-lists
title: "K-th of Two Lists"
topic: binary-search
pattern: kth-element
tags: [partition]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: kthOfTwo, params: [{ name: a, type: "int[]" }, { name: b, type: "int[]" }, { name: k, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Take about k/2 from each list. Whichever has the smaller last taken value, those taken values can't include the k-th, so throw them away."
  nudge: "Recursive halving: compare a[k/2 - 1] with b[k/2 - 1] (clamped to the list lengths) and drop the smaller block. Or binary search how many elements come from a."
