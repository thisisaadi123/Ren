schema_version: 1
id: median-of-two-queues
title: "Median of Two Queues"
topic: binary-search
pattern: kth-element
tags: [partition, divide-and-conquer]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: combinedMedian, params: [{ name: a, type: "int[]" }, { name: b, type: "int[]" }], returns: "double" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: float, tolerance: 1e-09 }
hints:
  hint: "You don't need to merge. Imagine cutting both lists so the left parts together hold half the values. What must be true at a correct cut?"
  nudge: "Binary search the cut i in the shorter list; the cut in the other list is j = (m + n + 1)/2 - i. The cut is right when a[i-1] ≤ b[j] and b[j-1] ≤ a[i]. Then the median comes from the four values around the cut."
authors: [ren]
reviewed_by: []
