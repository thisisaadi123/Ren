schema_version: 1
id: kth-in-times-table
title: "K-th in a Times Table"
topic: binary-search
pattern: kth-element
tags: [search-on-answer, math]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: kthInTable, params: [{ name: rows, type: "int" }, { name: cols, type: "int" }, { name: k, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The table can have 9 × 10⁸ cells, too many to list. For a value v, how many cells in row i are at most v?"
  nudge: "Row i holds i, 2i, …, cols·i, so it has min(v // i, cols) cells ≤ v. Sum over the rows and binary search the smallest v with at least k cells."
authors: [ren]
reviewed_by: []
