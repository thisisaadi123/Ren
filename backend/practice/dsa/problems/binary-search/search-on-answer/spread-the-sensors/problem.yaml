schema_version: 1
id: spread-the-sensors
title: "Spread the Sensors"
topic: binary-search
pattern: search-on-answer
tags: [greedy-check, sorting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: widestSpacing, params: [{ name: spots, type: "int[]" }, { name: sensors, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Pick a gap g. Can you place all the sensors so that every two are at least g apart? Larger g is harder."
  nudge: "Sort the spots. Binary search g; to test g, place a sensor at the first spot and then at every spot at least g past the last one placed."
