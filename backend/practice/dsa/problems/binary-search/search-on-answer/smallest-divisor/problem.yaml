schema_version: 1
id: smallest-divisor
title: "Smallest Divisor"
topic: binary-search
pattern: search-on-answer
tags: [greedy-check]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: smallestDivisor, params: [{ name: loads, type: "int[]" }, { name: threshold, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A bigger divisor always makes the total smaller or equal. So the valid divisors form one contiguous range."
  nudge: "Binary search d in [1, max(loads)] with total = Σ ceil(load / d). Find the smallest d with total ≤ threshold."
