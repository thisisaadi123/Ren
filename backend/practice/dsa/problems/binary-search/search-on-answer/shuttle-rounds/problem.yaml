schema_version: 1
id: shuttle-rounds
title: "Shuttle Rounds"
topic: binary-search
pattern: search-on-answer
tags: [greedy-check]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: minTimeForRounds, params: [{ name: roundTime, type: "int[]" }, { name: totalRounds, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "By time t, shuttle i has finished t // roundTime[i] rounds. That only grows with t."
  nudge: "Binary search t in [1, min(roundTime) × totalRounds]. Check Σ t // roundTime[i] ≥ totalRounds."
authors: [ren]
reviewed_by: []
