schema_version: 1
id: reading-speed
title: "Reading Speed"
topic: binary-search
pattern: search-on-answer
tags: [greedy-check]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: minReadingSpeed, params: [{ name: books, type: "int[]" }, { name: hours, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If you can finish at speed s, you can definitely finish at any speed faster than s."
  nudge: "Binary search s in [1, max(books)]. At speed s a book of p pages takes ceil(p / s) hours; check whether the total is at most `hours`."
authors: [ren]
reviewed_by: []
