status: draft
version: 1
kind: function
signature: { function: nthBeat, params: [{ name: n, type: "int" }, { name: a, type: "int" }, { name: b, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "How many numbers up to x are divisible by a or by b? Don't forget the ones divisible by both."
  nudge: "count(x) = x // a + x // b - x // lcm(a, b). Binary search the smallest x with count(x) ≥ n, then return it mod 10⁹ + 7."
