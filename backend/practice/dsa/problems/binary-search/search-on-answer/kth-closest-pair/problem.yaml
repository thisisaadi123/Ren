hints:
  hint: "There are about n²/2 pairs, far too many to list. Can you count how many pairs have a gap of at most d without listing them?"
  nudge: "Sort. For a candidate d, count pairs with gap ≤ d using two pointers in O(n). Binary search the smallest d whose count is at least k."
