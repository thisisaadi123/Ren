id: bouquet-day
title: "Bouquet Day"
topic: binary-search
pattern: search-on-answer
tags: [greedy-check]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: earliestBouquetDay, params: [{ name: bloom, type: "int[]" }, { name: bouquets, type: "int" }, { name: size, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "On day d, each flower has either bloomed or not. If you can make the bouquets on day d, can you on day d + 1?"
  nudge: "Binary search the day between min(bloom) and max(bloom). For a day d, walk the row counting runs of bloomed flowers; every `size` in a row makes one bouquet."
