id: closest-prices
title: "Closest Prices"
topic: binary-search
pattern: bounds
tags: [two-pointers, sliding-window]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: closestPrices, params: [{ name: prices, type: "int[]" }, { name: k, type: "int" }, { name: x, type: "int" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The answer is always k consecutive prices in the sorted list. Where can that window start?"
  nudge: "Binary search the window's start s in [0, n - k]: if x - prices[s] > prices[s + k] - x, the window should move right. Return prices[s : s + k]."
