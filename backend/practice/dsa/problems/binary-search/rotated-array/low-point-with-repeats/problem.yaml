version: 1
kind: function
signature: { function: lowestWithRepeats, params: [{ name: readings, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "With repeats, readings[mid] == readings[hi] tells you nothing about which side the minimum is on. Can you still safely discard something?"
  nudge: "If readings[mid] > readings[hi], go right; if it's smaller, go left (keep mid). If they're equal, drop just hi, since mid still holds that value."
