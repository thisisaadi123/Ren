hints:
  hint: "If the tree were a sorted array, you would walk two pointers in from both ends. Can you walk the tree from both ends at once?"
  nudge: "Run two in-order walks with explicit stacks: one ascending (go left first) and one descending (go right first). Compare the two current keys: equal to target → count and advance both; too small → advance the ascending walk; too big → advance the descending one. Stop when they meet."
