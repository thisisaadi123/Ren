schema_version: 1
id: audio-guide-steps
title: "Audio Guide Steps"
topic: bst
pattern: bst-inorder
tags: [iterator, stack, in-order]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: guideSteps, params: [{ name: root, type: "TreeNode" }, { name: ops, type: "string[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "You don't need the whole sorted list up front. What is the smallest key, and what do you need to remember to find the one after it?"
  nudge: "Keep a stack: push the root and keep going left. The top of the stack is the next key. When you pop a node, push its right child and that child's whole left chain. hasNext is just 'is the stack non-empty'. Each node is pushed and popped once."
