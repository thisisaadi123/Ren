hints:
  hint: "Read the tree in order. A correct search tree reads strictly increasing; where does this one stop increasing?"
  nudge: "During an in-order walk, record every place where a value is smaller than the one before it. With one such drop the two values next to it were swapped; with two drops, swap the larger value of the first drop with the smaller value of the second."
