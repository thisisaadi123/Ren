schema_version: 1
id: catalogue-order-check
title: "Catalogue Order Check"
topic: bst
pattern: bst-validate
tags: [dfs, binary-tree]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: isSearchTree, params: [{ name: root, type: "TreeNode" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Checking each node against its two children isn't enough. What does a node need to know about all of its ancestors?"
  nudge: "Walk down the tree carrying an open range (low, high). The root may be anything; going left the high end becomes the node's value, going right the low end does. Every value must lie strictly inside its range."
