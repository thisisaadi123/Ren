difficulty: hard
status: draft
version: 1
kind: function
signature: { function: richestOrderlyBranch, params: [{ name: root, type: "TreeNode" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Whether a node's branch is a search tree depends only on facts about its two child branches. Which facts?"
  nudge: "Work bottom-up. For each branch return: is it a search tree, its smallest and largest value, and its sum. A node's branch is a search tree when both child branches are, left max < value < right min. Track the best sum among valid branches; a leaf always counts, so start from minus infinity, not 0."
