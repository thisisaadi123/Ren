schema_version: 1
id: saved-in-preorder
title: "Saved in Preorder"
topic: bst
pattern: bst-validate
tags: [monotonic-stack, preorder]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: couldBePreorder, params: [{ name: keys, type: "int[]" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Once the sequence climbs above some earlier key, you've moved into that key's right side. What does that forbid for everything after?"
  nudge: "Keep a stack of keys whose right side you haven't entered, and a lower bound (start at minus infinity). For each key: if it's below the bound, answer false. While the stack top is smaller than the key, pop it and make it the new lower bound. Then push the key."
