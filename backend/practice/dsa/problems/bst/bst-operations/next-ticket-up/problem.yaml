schema_version: 1
id: next-ticket-up
title: "Next Ticket Up"
topic: bst
pattern: bst-operations
tags: [binary-search-tree, search]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: nextTicket, params: [{ name: root, type: "TreeNode" }, { name: x, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "At each node you either found a candidate (it's bigger than x) or you didn't. Which way should you go next in each case?"
  nudge: "Walk down from the root. If node.val > x, remember it as the best so far and go left to look for something smaller that still beats x; otherwise go right. The last remembered value is the answer."
authors: [ren]
reviewed_by: []
