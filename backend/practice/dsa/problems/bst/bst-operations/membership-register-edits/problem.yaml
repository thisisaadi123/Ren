schema_version: 1
id: membership-register-edits
title: "Membership Register Edits"
topic: bst
pattern: bst-operations
tags: [binary-search-tree, insert, delete]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: applyEdits, params: [{ name: root, type: "TreeNode" }, { name: ops, type: "int[][]" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Deleting a leaf or a node with one child is easy. For a node with two children, which key could take its place without breaking the order?"
  nudge: "Insert: walk down as if searching and hang the new key where the search falls off. Delete: find the node; with at most one child, link that child to the parent. With two children, copy in the smallest key of the right side, then remove that node (it has no left child, so its right child takes its place)."
