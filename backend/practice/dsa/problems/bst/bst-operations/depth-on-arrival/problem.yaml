id: depth-on-arrival
title: "Depth on Arrival"
topic: bst
pattern: bst-operations
tags: [binary-search-tree, linked-list, sorting]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: arrivalDepths, params: [{ name: keys, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "When a key is inserted, its parent must be one of two keys that are already in the tree. Which two?"
  nudge: "The new key's parent is its nearest smaller or nearest larger key among those already inserted — whichever is deeper (it was inserted later). So depth = 1 + max(depth of predecessor, depth of successor). Find those neighbours offline: put all keys in a sorted doubly linked list, walk the insertion order backwards, read each key's neighbours and then unlink it."
