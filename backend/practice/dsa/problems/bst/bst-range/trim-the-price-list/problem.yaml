schema_version: 1
id: trim-the-price-list
title: "Trim the Price List"
topic: bst
pattern: bst-range
tags: [recursion, pruning]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: trimPrices, params: [{ name: root, type: "TreeNode" }, { name: low, type: "int" }, { name: high, type: "int" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If a node's price is below `low`, its whole left side goes too. What should take the node's place?"
  nudge: "trim(node): if node is empty return empty; if node.val < low return trim(node.right); if node.val > high return trim(node.left); otherwise set node.left = trim(node.left), node.right = trim(node.right) and return node."
authors: [ren]
reviewed_by: []
