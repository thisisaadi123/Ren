schema_version: 1
id: harvest-in-a-band
title: "Harvest in a Band"
topic: bst
pattern: bst-range
tags: [dfs, pruning]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: bandTotal, params: [{ name: root, type: "TreeNode" }, { name: low, type: "int" }, { name: high, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If a node's key is below `low`, can anything in its left side be inside the band?"
  nudge: "Recurse (or use a stack). Below low: only the right side can matter. Above high: only the left side. Inside: add the key and look at both sides. Use a 64-bit total."
