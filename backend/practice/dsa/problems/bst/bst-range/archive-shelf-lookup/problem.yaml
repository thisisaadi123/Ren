schema_version: 1
id: archive-shelf-lookup
title: "Archive Shelf Lookup"
topic: bst
pattern: bst-range
tags: [in-order, binary-search]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: kthInBand, params: [{ name: root, type: "TreeNode" }, { name: queries, type: "int[][]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Each query only cares about keys between two bounds. If the keys were in one sorted list, where would that band start?"
  nudge: "Read the tree in order once to get the keys sorted. For a query [low, high, k], binary-search the first key ≥ low; the answer is the key k − 1 places later, if that position exists and the key there is ≤ high. Otherwise −1."
authors: [ren]
