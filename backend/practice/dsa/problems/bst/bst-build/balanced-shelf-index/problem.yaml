id: balanced-shelf-index
title: "Balanced Shelf Index"
topic: bst
pattern: bst-build
tags: [trees, recursion, divide-and-conquer]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: buildIndex, params: [{ name: codes, type: "int[]" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: custom }
hints:
  hint: "Which code should sit at the root so that both sides get about the same number of codes?"
  nudge: "Build(lo, hi): if lo > hi return nothing. Put codes[mid] at the root with mid = (lo + hi) // 2, then build the left subtree from lo..mid − 1 and the right from mid + 1..hi. Both halves differ in size by at most one, so the heights stay within one."
