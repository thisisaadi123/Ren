hints:
  hint: "An in-order walk of a search tree gives its values in sorted order, however lopsided the tree is. What can you build from a sorted list?"
  nudge: "Collect the values with an in-order walk (iterative, since the tree can be a 10⁴-node chain). Then build from the sorted list: the middle value is the root, the left half builds the left subtree and the right half builds the right one."
