tags: [linked-list, trees, divide-and-conquer]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: chainToTree, params: [{ name: head, type: "ListNode" }], returns: "TreeNode" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: custom }
hints:
  hint: "Picking the middle as the root works, but a linked list has no index. An in-order walk of the finished tree visits the values in list order. Can you build the tree in that order?"
  nudge: "Count the nodes first. Build(lo, hi) builds the left subtree from lo..mid − 1, then takes the CURRENT list node as the root and moves the pointer one step, then builds the right subtree from mid + 1..hi. Each list node is used exactly once, in order, for O(n) time."
