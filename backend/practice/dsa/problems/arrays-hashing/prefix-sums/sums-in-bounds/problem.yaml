schema_version: 1
id: sums-in-bounds
title: "Sums Within Bounds"
topic: arrays-hashing
pattern: prefix-sums
tags: [prefix-sums, merge-sort, divide-and-conquer]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: countSumsInBounds, params: [{ name: nums, type: "int[]" }, { name: lower, type: "int" }, { name: upper, type: "int" }], returns: "long" }
limits: { time_ms: 1500, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "With prefix sums p, a stretch [i, j] qualifies when lower ≤ p[j + 1] - p[i] ≤ upper. For each right end, how many earlier prefix sums fall in a window?"
  nudge: "Merge sort the prefix sums. While merging, for each prefix in the left half, move two pointers through the (sorted) right half to count values in [p + lower, p + upper]. A Fenwick tree over compressed values also works."
