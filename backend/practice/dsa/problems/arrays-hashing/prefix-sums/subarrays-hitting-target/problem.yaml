status: draft
version: 1
kind: function
signature: { function: countTargetStretches, params: [{ name: nums, type: "int[]" }, { name: target, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A stretch from i to j sums to target exactly when prefix[j + 1] - prefix[i] == target. Numbers can be negative, so a sliding window won't work."
  nudge: "Sweep with a running prefix sum and a hash map counting earlier prefix sums. At each step add count[prefix - target]."
