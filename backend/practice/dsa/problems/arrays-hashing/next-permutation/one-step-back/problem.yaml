schema_version: 1
id: one-step-back
title: "One Step Back"
topic: arrays-hashing
pattern: next-permutation
tags: [arrays, greedy]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: stepBack, params: [{ name: ratings, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Going backwards in dictionary order is the mirror image of going forwards. From the right, where is the first place the values go down?"
  nudge: "Find the rightmost i with ratings[i] > ratings[i + 1]; the part after i is ascending. Swap ratings[i] with the largest smaller value after it, taking its LAST copy, then reverse the part after i so it reads in descending order. If there's no such i, the list is the first ordering: return it reversed."
