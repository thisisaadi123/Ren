id: next-mirror-number
title: "Next Mirror Number"
topic: arrays-hashing
pattern: next-permutation
tags: [strings, palindrome]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: nextMirror, params: [{ name: code, type: "string" }], returns: "string" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A palindrome is decided by its left half. Which digits can its left half use, and does the middle digit ever move?"
  nudge: "Take the left half code[0 : n / 2]. Its digits are fixed as a group, and an odd middle digit has to stay in the middle. The next palindrome comes from the next arrangement of the left half (rightmost ascent, swap with the smallest bigger digit after it, reverse the rest), then mirror it. No next arrangement of the half means no answer."
