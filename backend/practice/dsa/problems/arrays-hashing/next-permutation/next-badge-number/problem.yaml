schema_version: 1
id: next-badge-number
title: "Next Badge Number"
topic: arrays-hashing
pattern: next-permutation
tags: [strings, greedy]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: nextBadge, params: [{ name: code, type: "string" }], returns: "string" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Scan from the right. Where is the first digit that has something bigger somewhere after it? Everything to its left must stay as it is."
  nudge: "Find the rightmost i with code[i] < code[i + 1]. The digits after i are in descending order. Swap code[i] with the smallest digit after it that is still bigger (the rightmost one that beats it), then reverse the part after i so it reads in ascending order."
authors: [ren]
reviewed_by: []
