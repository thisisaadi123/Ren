tags: [in-place]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: findDoubleBooked, params: [{ name: bookings, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Values are between 1 and n, so each one points at a slot in the same array. How can a slot record \"seen once already\"?"
  nudge: "For each value v, look at bookings[v - 1]. If it's already negative, v is a repeat; otherwise flip it negative. Sort the repeats at the end."
