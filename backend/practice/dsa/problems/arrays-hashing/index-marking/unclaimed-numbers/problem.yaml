version: 1
kind: function
signature: { function: findUnclaimed, params: [{ name: tickets, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Every value is between 1 and n, so every value is also a valid index. Can the array itself remember which values you've seen?"
  nudge: "For each value v, make tickets[v - 1] negative. Afterwards, every index that's still positive is an unclaimed number. That's O(1) extra space."
