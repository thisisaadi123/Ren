schema_version: 1
id: first-missing-ticket
title: "First Missing Ticket"
topic: arrays-hashing
pattern: index-marking
tags: [in-place, cyclic-sort]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: firstMissing, params: [{ name: nums, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The answer is always between 1 and n + 1. So only values in that range matter, and each has a natural home index."
  nudge: "Cyclic placement: while nums[i] is in 1..n and nums[nums[i] - 1] != nums[i], swap it into its home. Then the first index i with nums[i] != i + 1 gives the answer i + 1."
authors: [ren]
