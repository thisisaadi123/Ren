signature: { function: findMislabel, params: [{ name: labels, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Every number from 1 to n should appear exactly once. Put each number at index number - 1 and see which spot ends up wrong."
  nudge: "Swap labels[i] into index labels[i] - 1 until each spot holds its own number or a repeat. Then the index whose value doesn't match holds the duplicate, and index + 1 is the missing number."
