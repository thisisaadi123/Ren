schema_version: 1
id: first-k-missing
title: "First K Missing Positives"
topic: arrays-hashing
pattern: cyclic-sort
tags: [arrays, cyclic-sort]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: firstMissing, params: [{ name: nums, type: "int[]" }, { name: k, type: "int" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Numbers from 1 to n can be parked at index number - 1. Whatever doesn't fit there is noise, but it still tells you which big numbers are taken."
  nudge: "Cyclic-sort the values in 1..n into place. Scan for spots that don't hold their own number: those are missing. Remember the out-of-place values in a set, then continue past n, skipping them, until you have k."
