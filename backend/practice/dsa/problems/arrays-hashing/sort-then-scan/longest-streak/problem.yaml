schema_version: 1
id: longest-streak
title: "Longest Streak"
topic: arrays-hashing
pattern: sort-then-scan
tags: [hash-set, sorting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: longestStreak, params: [{ name: days, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A streak is a run of consecutive integers, in any order in the list. Where does a streak start?"
  nudge: "Put the days in a set. Only start counting from a day d where d - 1 isn't in the set, then walk d + 1, d + 2, …. Each day is visited at most twice, so it's O(n). Sorting then scanning works in O(n log n)."
