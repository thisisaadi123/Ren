schema_version: 1
id: stadium-sections
title: "Stadium Sections"
topic: arrays-hashing
pattern: difference-arrays
tags: [difference-array, prefix-sums]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: sectionCounts, params: [{ name: n, type: "int" }, { name: groups, type: "int[][]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Adding a group to every section in its range one by one is slow. Can you mark just where the group starts and stops?"
  nudge: "Use a difference array: diff[l] += people and diff[r + 1] -= people for each group. A running sum over diff gives each section's count."
