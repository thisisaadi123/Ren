schema_version: 1
id: colony-next-generation
title: "Colony Next Generation"
topic: arrays-hashing
pattern: matrix-in-place
tags: [matrix, simulation]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: nextGeneration, params: [{ name: board, type: "int[][]" }], returns: "int[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Every cell changes at the same moment. If you overwrite a cell early, its neighbours later read the wrong value. Can one number hold both the old state and the new one?"
  nudge: "Keep the current state in bit 0 and write the next state into bit 1 (cell |= 2 when it will be alive). Neighbours always read cell & 1, so the old state stays visible. After the full pass, shift every cell right by one."
