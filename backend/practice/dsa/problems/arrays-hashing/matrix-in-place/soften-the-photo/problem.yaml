id: soften-the-photo
title: "Soften the Photo"
topic: arrays-hashing
pattern: matrix-in-place
tags: [matrix]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: soften, params: [{ name: image, type: "int[][]" }], returns: "int[][]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Each new pixel depends on old pixels around it. A pixel fits in 8 bits, so is there spare room in each number to park the new value?"
  nudge: "For each pixel, add up (cell & 255) over the 3 × 3 block clipped to the grid and divide by how many cells were in it. Store the result in the high bits: cell |= avg << 8. When every pixel is done, shift each cell right by 8."
