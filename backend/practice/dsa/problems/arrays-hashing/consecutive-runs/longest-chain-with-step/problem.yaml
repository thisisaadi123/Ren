schema_version: 1
id: longest-chain-with-step
title: "Longest Chain With a Step"
topic: arrays-hashing
pattern: consecutive-runs
tags: [arrays, hash-set]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: longestChain, params: [{ name: values, type: "int[]" }, { name: step, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A chain is v, v + step, v + 2·step, … Where can a chain start?"
  nudge: "Put the values in a set. Only start counting from v when v - step is not in the set; then walk v, v + step, … while they exist. Each value is visited O(1) times overall."
