schema_version: 1
id: next-arrangement
title: "Next Arrangement"
topic: arrays-hashing
pattern: rotate-reverse
tags: [arrays, two-pointers]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: nextArrangement, params: [{ name: values, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "From the right, find the first position where the sequence stops increasing. Everything after it is already as large as it can be."
  nudge: "Find the rightmost i with values[i] < values[i + 1]. Swap values[i] with the smallest larger value to its right (the rightmost one bigger than it), then reverse the suffix after i. If there's no such i, reverse everything."
