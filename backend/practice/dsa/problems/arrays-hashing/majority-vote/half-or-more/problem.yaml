schema_version: 1
id: half-or-more
title: "More Than Half?"
topic: arrays-hashing
pattern: majority-vote
tags: [arrays, counting]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: strictMajority, params: [{ name: votes, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Pair up two different votes and cross them both out. Whatever survives is the only possible majority, but it might not be one."
  nudge: "Run Boyer-Moore: keep a candidate and a counter, adding one for a match and subtracting one otherwise, switching when the counter hits zero. Then count the candidate once more to confirm it really has more than half."
