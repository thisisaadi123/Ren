schema_version: 1
id: count-mirrors
title: "Count the Mirrors"
topic: strings
pattern: expand-center
tags: [palindromes, counting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: countMirrors, params: [{ name: s, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Instead of checking each substring, grow palindromes outward. Each step outward that still matches is one more palindrome."
  nudge: "For each of the 2n - 1 centers, expand while s[i] == s[j]; every successful expansion (including the start) adds one to the count."
authors: [ren]
reviewed_by: []
