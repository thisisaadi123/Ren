schema_version: 1
id: palindrome-census
title: "Palindrome Census"
topic: strings
pattern: expand-center
tags: [palindromes, manacher]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: palindromeCensus, params: [{ name: s, type: "string" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Expanding from every center is O(n²) on a string like \"aaaa...\". Can one center reuse what a bigger palindrome around it already told you?"
  nudge: "Manacher's algorithm: keep the palindrome reaching furthest right. A center inside it starts from its mirror's radius (capped at the right edge), then expands. Sum the radii."
authors: [ren]
reviewed_by: []
