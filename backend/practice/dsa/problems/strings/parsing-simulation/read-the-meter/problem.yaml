schema_version: 1
id: read-the-meter
title: "Read the Meter"
topic: strings
pattern: parsing-simulation
tags: [parsing, simulation]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: readMeter, params: [{ name: text, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Follow the rules as a little state machine: spaces, then a sign, then digits. What has to be true about the characters around a `_` for it to count?"
  nudge: "Scan once. A `_` is skipped only when a digit has been read and the next character is a digit. Cap the running value as soon as it passes 2³¹ so it never overflows, then apply the sign and clamp."
