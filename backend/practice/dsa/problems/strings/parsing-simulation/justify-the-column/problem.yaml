schema_version: 1
id: justify-the-column
title: "Justify the Column"
topic: strings
pattern: parsing-simulation
tags: [simulation, greedy, formatting]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: justify, params: [{ name: words, type: "string[]" }, { name: width, type: "int" }], returns: "string[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Split the work in two: first decide which words go on each line, then decide how many spaces go in each gap of that line."
  nudge: "Fill a line while the words plus one space between each still fit. For a full line with g gaps and s spare spaces, every gap gets s // g spaces and the first s % g gaps get one extra. The last line and one-word lines are left-aligned and padded at the end."
authors: [ren]
