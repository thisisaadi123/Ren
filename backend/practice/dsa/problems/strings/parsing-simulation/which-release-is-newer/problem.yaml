tags: [parsing, two-pointers]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: compareReleases, params: [{ name: a, type: "string" }, { name: b, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Walk both release numbers one revision at a time. What should a missing revision count as, and can you compare two long revisions without turning them into integers?"
  nudge: "Cut each release at the dots. Strip leading zeros from the two revisions: the longer one is bigger, and equal lengths compare letter by letter. Pad the shorter release with 0 revisions."
