schema_version: 1
id: zigzag-banner
title: "Zigzag Banner"
topic: strings
pattern: parsing-simulation
tags: [simulation, math]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: zigzagCode, params: [{ name: text, type: "string" }, { name: rows, type: "int" }], returns: "string" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Follow the characters down and back up. The pattern repeats: how many characters make one full down-and-up trip?"
  nudge: "One trip is cycle = 2 · (rows − 1) characters (with rows = 1 as a special case). Row r gets the characters at positions k·cycle + r, and a middle row also gets k·cycle + cycle − r. Emit rows one after another."
