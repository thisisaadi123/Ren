schema_version: 1
id: rhythm-of-words
title: "Rhythm of Words"
topic: strings
pattern: char-mapping
tags: [hash-map, bijection]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: followsRhythm, params: [{ name: pattern, type: "string" }, { name: sentence, type: "string" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Each letter must always meet the same word, and each word must always meet the same letter. How many maps do you need to check both?"
  nudge: "Split the sentence into words and check the counts match. Walk both together with two hash maps, letter → word and word → letter; any disagreement means false."
