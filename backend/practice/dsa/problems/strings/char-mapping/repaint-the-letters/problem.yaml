schema_version: 1
id: repaint-the-letters
title: "Repaint the Letters"
topic: strings
pattern: char-mapping
tags: [hash-map, graph]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: canRepaint, params: [{ name: s, type: "string" }, { name: t, type: "string" }, { name: m, type: "int" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Once two colours are merged they can never be separated. So what must be true about which target colour each current colour ends up as? And how do you swap two colours around?"
  nudge: "Every colour in s must always land on one colour in t, so check that s → t is a function. If it is and s ≠ t, you can untangle any cycle through a spare colour — which exists exactly when t uses fewer than m colours."
