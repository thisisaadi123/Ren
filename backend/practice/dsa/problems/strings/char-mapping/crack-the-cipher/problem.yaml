schema_version: 1
id: crack-the-cipher
title: "Crack the Cipher"
topic: strings
pattern: char-mapping
tags: [hash-map, bijection]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: crackCipher, params: [{ name: plain, type: "string" }, { name: coded, type: "string" }, { name: message, type: "string" }], returns: "string" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Line up the two versions of the sentence to learn coded → plain pairs. What extra fact does a one-to-one cipher give you when only one letter is still unknown?"
  nudge: "Build a map coded letter → plain letter from the pair (a 26-entry table). If exactly 25 coded letters are known, the missing coded letter must map to the one plain letter not used yet. Then decode message with the table, writing ? for anything unknown."
