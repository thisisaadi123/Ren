schema_version: 1
id: cut-out-the-middle
title: "Cut Out the Middle"
topic: strings
pattern: palindrome-checks
tags: [two-pointers, kmp, greedy]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: shortestCut, params: [{ name: s, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "What's left after the cut is a prefix of s glued to a suffix of s. While the outermost letters agree, is there any reason not to keep them?"
  nudge: "Match s from both ends as far as it goes; keeping those letters is always safe. In the unmatched middle, the kept part must be a palindromic prefix or suffix of the middle. Find the longest of each in O(n) with the prefix function of mid + '#' + reverse(mid) (and the same for the reverse)."
authors: [ren]
reviewed_by: []
