schema_version: 1
id: one-slip-palindrome
title: "One Slip Palindrome"
topic: strings
pattern: palindrome-checks
tags: [two-pointers, greedy]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: oneSlip, params: [{ name: s, type: "string" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Compare from both ends. Nothing needs deleting while the ends agree. When they first disagree, which characters could the deleted one be?"
  nudge: "Move two pointers inward until s[i] ≠ s[j]. The deleted character must be s[i] or s[j], so check whether s[i+1..j] or s[i..j−1] is a palindrome. That's O(n) in total."
