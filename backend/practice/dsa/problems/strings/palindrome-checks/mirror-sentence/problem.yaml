schema_version: 1
id: mirror-sentence
title: "Mirror Sentence"
topic: strings
pattern: palindrome-checks
tags: [two-pointers]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: isMirror, params: [{ name: text, type: "string" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Put one finger at each end of the text. What should a finger do when it's on a space or a comma?"
  nudge: "Two pointers from both ends: skip characters that aren't letters or digits, compare the rest case-insensitively, and move both inward. No need to build a cleaned copy."
