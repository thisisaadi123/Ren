schema_version: 1
id: distinct-windows
title: "Distinct Windows"
topic: strings
pattern: rolling-hash
tags: [hashing, sliding-window]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: distinctWindows, params: [{ name: s, type: "string" }, { name: k, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Each window of length k needs a fingerprint. Can you get the next window's fingerprint from the current one without rereading k letters?"
  nudge: "Keep a polynomial hash of the window. Sliding right: subtract the leaving letter times base^(k-1), multiply by the base, add the new letter. Count distinct hashes (use a large modulus, or two)."
authors: [ren]
reviewed_by: []
