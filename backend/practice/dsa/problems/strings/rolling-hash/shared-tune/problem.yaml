schema_version: 1
id: shared-tune
title: "Shared Tune"
topic: strings
pattern: rolling-hash
tags: [hashing, binary-search]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: sharedTune, params: [{ name: a, type: "string" }, { name: b, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If the two songs share a run of L notes, they also share a run of every shorter length. That's a yes/no question you can binary search."
  nudge: "Binary search on L. For a given L, put the rolling hashes of all length-L windows of a in a set, then slide over b looking for a hit (confirm with a direct compare to rule out collisions)."
authors: [ren]
reviewed_by: []
