schema_version: 1
id: find-every-tag
title: "Find Every Tag"
topic: strings
pattern: pattern-matching
tags: [kmp]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: findAll, params: [{ name: text, type: "string" }, { name: tag, type: "string" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "When a match fails partway through, you've already read those letters. Do you really have to start over from the next position?"
  nudge: "Build the KMP failure table for tag (the longest proper prefix that is also a suffix, for each prefix). Scan text once, falling back through the table on a mismatch; each time the whole tag matches, record the start."
authors: [ren]
reviewed_by: []
