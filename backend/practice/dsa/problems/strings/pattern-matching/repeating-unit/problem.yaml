id: repeating-unit
title: "Repeating Unit"
topic: strings
pattern: pattern-matching
tags: [kmp]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: shortestUnit, params: [{ name: s, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "If s is a block repeated several times, the part of s that is both a prefix and a suffix is long. How long, exactly?"
  nudge: "Compute the KMP failure value f of the whole string. Let p = n - f. If p divides n, the answer is p; otherwise the string has no shorter unit and the answer is n."
