schema_version: 1
id: front-padding
title: "Front Padding"
topic: strings
pattern: pattern-matching
tags: [kmp, palindromes]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: padToPalindrome, params: [{ name: s, type: "string" }], returns: "string" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "You only add letters at the front, so the letters you keep at the start of the result are s itself. The question is how much of s's start is already a palindrome."
  nudge: "Find the longest prefix of s that is a palindrome: run KMP's failure function on s + '#' + reverse(s); the last value is its length. Prepend the reverse of the rest of s."
