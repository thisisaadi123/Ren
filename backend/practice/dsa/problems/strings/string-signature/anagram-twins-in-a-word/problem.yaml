schema_version: 1
id: anagram-twins-in-a-word
title: "Anagram Twins in a Word"
topic: strings
pattern: string-signature
tags: [hash-map, counting, sliding-window]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: anagramTwins, params: [{ name: s, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Two substrings can only be anagrams if they have the same length. For one length, can you give every substring a key so that anagrams get the same key?"
  nudge: "For each length L, slide a window of L letters across s, keeping its 26 letter counts. Use the counts as a key in a hash map; a key seen c times adds c·(c−1)/2 pairs."
