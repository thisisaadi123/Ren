schema_version: 1
id: swap-and-relabel
title: "Swap and Relabel"
topic: strings
pattern: string-signature
tags: [counting, hash-map, sorting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: canReshape, params: [{ name: a, type: "string" }, { name: b, type: "string" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Swaps let you put the letters in any order, so only the letter counts matter. What does a relabel do to the counts, and what can it never do?"
  nudge: "A relabel swaps which letters own which counts, but never adds a new letter or changes the multiset of counts. So a works iff both words use the same set of letters and the sorted lists of their letter counts are equal."
