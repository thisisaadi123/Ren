schema_version: 1
id: scrambled-name-tag
title: "Scrambled Name Tag"
topic: strings
pattern: string-signature
tags: [counting, hash-map]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: isScramble, params: [{ name: a, type: "string" }, { name: b, type: "string" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Spaces and capital letters don't matter. What's left to compare once you ignore them?"
  nudge: "Count each letter (lowercased) in a, subtract the counts from b, and check every count ends at zero. 26 counters are enough."
