schema_version: 1
id: stack-from-a-queue
title: "Stack From a Queue"
topic: stacks-queues
pattern: structure-emulation
tags: [stack, queue, design]
difficulty: easy
status: draft
version: 1
kind: design
design:
  class: QueueStack
  constructor: { params: [] }
  methods:
    - { name: push, params: [{ name: x, type: "int" }], returns: "void" }
    - { name: pop, params: [], returns: "int" }
    - { name: top, params: [], returns: "int" }
    - { name: empty, params: [], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A queue gives you the oldest item, but a stack needs the newest. After adding an item, can you rotate the queue so the new item comes out first?"
  nudge: "On push(x), add x to the back, then move the other size − 1 items from the front to the back one by one. Now x is at the front, so pop and top just read the front."
