schema_version: 1
id: ring-buffer
title: "Ring Buffer"
topic: stacks-queues
pattern: structure-emulation
tags: [queue, arrays, design]
difficulty: medium
status: draft
version: 1
kind: design
design:
  class: RingBuffer
  constructor: { params: [{ name: k, type: "int" }] }
  methods:
    - { name: enqueue, params: [{ name: x, type: "int" }], returns: "bool" }
    - { name: dequeue, params: [], returns: "bool" }
    - { name: front, params: [], returns: "int" }
    - { name: rear, params: [], returns: "int" }
    - { name: isEmpty, params: [], returns: "bool" }
    - { name: isFull, params: [], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Use a fixed array of size k with a head index and a count. Where does the next item go, and where is the last one?"
  nudge: "Store head and size. The next free slot is (head + size) % k and the last item is at (head + size − 1) % k. enqueue writes there and adds 1 to size; dequeue moves head forward by one (mod k). Full means size == k; empty means size == 0."
authors: [ren]
