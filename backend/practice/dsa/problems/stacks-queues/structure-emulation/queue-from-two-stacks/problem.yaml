id: queue-from-two-stacks
title: "Queue From Two Stacks"
topic: stacks-queues
pattern: structure-emulation
tags: [stack, queue, design]
difficulty: easy
status: draft
version: 1
kind: design
design:
  class: TwoStackQueue
  constructor: { params: [] }
  methods:
    - { name: push, params: [{ name: x, type: "int" }], returns: "void" }
    - { name: pop, params: [], returns: "int" }
    - { name: peek, params: [], returns: "int" }
    - { name: empty, params: [], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "One stack takes new items. When you need the oldest item, how can a second stack put the items in the order you need?"
  nudge: "Push onto `inbox`. For pop or peek, if `outbox` is empty, move everything from inbox to outbox (this reverses the order); the top of outbox is then the oldest item. Each item moves at most once, so every call is O(1) on average."
