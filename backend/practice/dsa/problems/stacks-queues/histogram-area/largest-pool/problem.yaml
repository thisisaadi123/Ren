topic: stacks-queues
pattern: histogram-area
tags: [monotonic-stack, arrays, two-pointers]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: largestPool, params: [{ name: walls, type: "int[]" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "First work out how much water stands above each column. Then which columns belong to the same pool?"
  nudge: "Water above column i is min(tallest to its left, tallest to its right) − walls[i], which a stack of falling walls (filling layer by layer) or prefix/suffix maxima gives you. A pool is a maximal run of columns with water > 0; add up each run and keep the largest."
