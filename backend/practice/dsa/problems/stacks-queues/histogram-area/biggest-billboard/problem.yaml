schema_version: 1
id: biggest-billboard
title: "Biggest Billboard"
topic: stacks-queues
pattern: histogram-area
tags: [monotonic-stack, arrays]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: biggestBillboard, params: [{ name: heights, type: "int[]" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "In the best billboard, some building is the shortest one it touches, and the billboard is as tall as that building."
  nudge: "Keep a stack of indexes with rising heights. When a shorter building arrives, pop: the popped building is the shortest of a rectangle reaching from just after the new stack top to just before the current index. A final height-0 sentinel flushes the stack."
authors: [ren]
reviewed_by: []
