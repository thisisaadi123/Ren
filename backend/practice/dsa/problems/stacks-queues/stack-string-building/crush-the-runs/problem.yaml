schema_version: 1
id: crush-the-runs
title: "Crush the Runs"
topic: stacks-queues
pattern: stack-string-building
tags: [strings, stack]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: crushRuns, params: [{ name: s, type: "string" }, { name: k, type: "int" }], returns: "string" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "After a run is crushed, its neighbours touch and may form a new run. A stack lets you see the run that ends right before the next letter."
  nudge: "Keep a stack of [letter, count] pairs. For each letter: if it matches the top, add 1 to the top's count, else push [letter, 1]. When a count reaches k, pop it. At the end, write each letter count times."
authors: [ren]
