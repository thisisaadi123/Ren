hints:
  hint: "A `k[...]` group can sit inside another. When you reach `]`, what do you need to remember from before the matching `[`?"
  nudge: "Keep a stack of (text so far, repeat count). On a digit, build the number. On `[`, push (current text, number) and start fresh. On `]`, pop (prev, k) and set current = prev + current * k. On a letter, append it."
