schema_version: 1
id: best-pair-of-posts
title: "Best Pair of Posts"
topic: stacks-queues
pattern: monotonic-deque
tags: [arrays, deque, monotonic]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: bestPair, params: [{ name: posts, type: "int[][]" }, { name: k, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "For i < j, yi + yj + |xi − xj| is (yj + xj) + (yi − xi). For a fixed j, you want the largest yi − xi among posts at most k to the left."
  nudge: "Walk the posts left to right with a deque of indexes whose yi − xi decreases from front to back. For post j: drop the front while x[j] − x[front] > k, use the front (if any) to score, then pop the back while y − x there is ≤ yj − xj, and push j."
authors: [ren]
reviewed_by: []
