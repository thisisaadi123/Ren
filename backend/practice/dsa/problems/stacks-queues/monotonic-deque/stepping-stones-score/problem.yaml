id: stepping-stones-score
title: "Stepping Stones Score"
topic: stacks-queues
pattern: monotonic-deque
tags: [arrays, dynamic-programming, deque]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: bestScore, params: [{ name: stones, type: "int[]" }, { name: k, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Let best[i] be the highest score that lands on stone i. It comes from the best of the previous k stones. How do you keep the maximum of a sliding window of best values?"
  nudge: "best[0] = stones[0]. For each i, best[i] = stones[i] + max(best[i − k .. i − 1]). Keep a deque of indexes with decreasing best values: drop the front when it's older than i − k, read the max from the front, then pop the back while best[back] ≤ best[i] before pushing i."
