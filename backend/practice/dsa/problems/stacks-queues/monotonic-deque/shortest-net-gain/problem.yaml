schema_version: 1
id: shortest-net-gain
title: "Shortest Net Gain"
topic: stacks-queues
pattern: monotonic-deque
tags: [arrays, prefix-sums, deque, monotonic]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: shortestNetGain, params: [{ name: changes, type: "int[]" }, { name: target, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "With negative values a plain sliding window breaks. Think in prefix sums: you want j > i with P[j] − P[i] ≥ target and j − i small. Which earlier prefixes are ever worth keeping?"
  nudge: "Build prefix sums P. Keep a deque of indexes with increasing P. For each j: while P[j] − P[front] ≥ target, record j − front and pop the front (it can't do better later). Then pop from the back while P[back] ≥ P[j] (j is a better start), and push j."
