schema_version: 1
id: window-peaks
title: "Window Peaks"
topic: stacks-queues
pattern: monotonic-deque
tags: [arrays, deque, monotonic]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: windowPeaks, params: [{ name: temps, type: "int[]" }, { name: k, type: "int" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "When a new reading arrives, any older, smaller reading in the window can never be a peak again. What should happen to it?"
  nudge: "Keep a deque of indexes whose readings decrease from front to back. For each i: pop from the back while temps[back] ≤ temps[i], push i, and pop the front if it's i − k or older. From i = k − 1 on, temps[front] is the window's peak."
