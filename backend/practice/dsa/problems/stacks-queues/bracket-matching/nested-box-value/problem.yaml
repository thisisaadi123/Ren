checker: { type: exact }
hints:
  hint: "When a `)` closes a box, you need the total of what was inside it. Where can you keep that running total?"
  nudge: "Keep a stack of running totals, one per open box. On `(` push 0. On `)` pop the inner total t; the box is worth 1 if t is 0, else 2·t; add that to the new top."
