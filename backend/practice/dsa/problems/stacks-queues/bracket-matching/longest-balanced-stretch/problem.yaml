checker: { type: exact }
hints:
  hint: "A balanced stretch ends at a `)`. When a `)` finds its partner, where did the balanced stretch ending here begin?"
  nudge: "Keep a stack of indexes, starting with -1 as a base. Push the index of each `(`. On `)`, pop; if the stack is now empty, push this index as the new base, otherwise the stretch ending here has length i - stack[-1]."
