schema_version: 1
id: ticket-line
title: "Ticket Line"
topic: stacks-queues
pattern: queue-simulation
tags: [arrays, queue, simulation]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: secondsToFinish, params: [{ name: wants, type: "int[]" }, { name: k, type: "int" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "You don't have to simulate every second. For each person in line, how many tickets will they have bought by the moment person k buys their last one?"
  nudge: "Person k buys wants[k] tickets. Anyone at or before k in line buys min(wants[i], wants[k]) by then. Anyone after k gets one fewer round: min(wants[i], wants[k] − 1). Add these up."
