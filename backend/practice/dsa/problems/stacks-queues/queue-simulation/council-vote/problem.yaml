id: council-vote
title: "Council Vote"
topic: stacks-queues
pattern: queue-simulation
tags: [strings, queue, greedy, simulation]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: councilWinner, params: [{ name: council, type: "string" }], returns: "string" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "When a member gets to act, whom should they silence to help their own party most?"
  nudge: "Put the indexes of each party in its own queue. Repeatedly compare the two fronts: the earlier one acts and silences the other (pop it for good), then rejoins its own queue at index + n so it acts again next round. The party whose queue empties first loses."
