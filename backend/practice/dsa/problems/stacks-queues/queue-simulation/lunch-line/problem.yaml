schema_version: 1
id: lunch-line
title: "Lunch Line"
topic: stacks-queues
pattern: queue-simulation
tags: [arrays, queue, counting]
difficulty: easy
status: draft
version: 1
kind: function
signature: { function: hungryStudents, params: [{ name: prefers, type: "int[]" }, { name: trays, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The order of the students in line doesn't matter in the end: a student who doesn't want the top tray just goes round again. When does the line get stuck?"
  nudge: "Count how many students want each kind. Go through the trays from the top: if someone still wants that kind, they take it (decrease that count). The first tray nobody wants stops everything; the students left over are the answer."
