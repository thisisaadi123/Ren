schema_version: 1
id: price-streak-tracker
title: "Price Streak Tracker"
topic: stacks-queues
pattern: monotonic-stack
tags: [monotonic-stack, design]
difficulty: medium
status: draft
version: 1
kind: design
design:
  class: PriceStreak
  constructor: { params: [] }
  methods:
    - { name: record, params: [{ name: price, type: "int" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Once a price is beaten by a later, higher-or-equal price, will anyone after that ever need to look at it on its own?"
  nudge: "Keep a stack of (price, streak) pairs with strictly falling prices. On a new price, pop every pair whose price is ≤ it and add their streaks to 1. Push the result."
