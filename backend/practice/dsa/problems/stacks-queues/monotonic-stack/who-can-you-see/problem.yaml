schema_version: 1
id: who-can-you-see
title: "Who Can You See"
topic: stacks-queues
pattern: monotonic-stack
tags: [monotonic-stack, arrays]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: canSee, params: [{ name: heights, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Walk from the back of the line. Once someone at least as tall as you stands in front of a shorter person, can anyone further forward still see that shorter person?"
  nudge: "Go right to left with a stack of heights that strictly decreases toward the top. For person i: pop and count everyone shorter; if the stack is still non-empty, count the top too (the first person at least as tall). If that top has exactly the same height, pop it as well: i now hides them. Push i."
