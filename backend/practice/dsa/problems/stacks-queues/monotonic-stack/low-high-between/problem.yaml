hints:
  hint: "Fix the middle-sized value's role: scanning from the right, which value would you most like to be the 'in between' one?"
  nudge: "Scan right to left keeping a stack of values that decreases toward the top, and `mid` = the largest value ever popped (it has something bigger to its left side of the scan). Any new value below `mid` completes the triple. Pop while the top is smaller than the new value, raising `mid`."
