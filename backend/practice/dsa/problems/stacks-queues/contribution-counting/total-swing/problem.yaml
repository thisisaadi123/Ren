schema_version: 1
id: total-swing
title: "Total Swing"
topic: stacks-queues
pattern: contribution-counting
tags: [arrays, stack, monotonic, math]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: totalSwing, params: [{ name: readings, type: "int[]" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "The swing of a stretch is its max minus its min. So the total is (sum of every stretch's max) − (sum of every stretch's min). Each of those can be counted element by element."
  nudge: "For each i, count the stretches where readings[i] is the max: (distance to the previous strictly greater) × (distance to the next greater-or-equal), using monotonic stacks. Do the same for the min with smaller instead of greater. The answer is Σ readings[i] × (maxCount[i] − minCount[i])."
authors: [ren]
reviewed_by: []
