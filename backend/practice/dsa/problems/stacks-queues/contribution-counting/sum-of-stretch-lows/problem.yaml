title: "Sum of Stretch Lows"
topic: stacks-queues
pattern: contribution-counting
tags: [arrays, stack, monotonic, math]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: sumOfLows, params: [{ name: prices, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Instead of visiting every stretch, ask for each price: in how many stretches is it the lowest? That depends on how far it can reach left and right before meeting something smaller."
  nudge: "With monotonic stacks, find left[i] = distance to the previous price that is strictly smaller and right[i] = distance to the next price that is smaller or equal. Price i is the low of left[i] × right[i] stretches. Breaking ties on one side only counts each stretch once. Sum prices[i] × left[i] × right[i] mod 10⁹ + 7."
