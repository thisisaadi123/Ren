schema_version: 1
id: convoys-to-the-depot
title: "Convoys to the Depot"
topic: stacks-queues
pattern: stack-simulation
tags: [arrays, stack, sorting]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: convoys, params: [{ name: depot, type: "int" }, { name: position, type: "int[]" }, { name: speed, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "A truck can't pass the one in front; if it catches up, they drive together. Starting from the truck closest to the depot, when does a truck form a new convoy?"
  nudge: "Sort the trucks by position, closest to the depot first. A truck's arrival time is (depot − position) / speed. Walk the list, keeping the slowest arrival time so far; a truck that would arrive LATER than that starts a new convoy, otherwise it joins the one ahead. Compare times by cross-multiplying to stay exact."
authors: [ren]
