schema_version: 1
id: comet-collisions
title: "Comet Collisions"
topic: stacks-queues
pattern: stack-simulation
tags: [arrays, stack, simulation]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: afterCollisions, params: [{ name: comets, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Only a comet moving left can hit something, and the only thing it can hit is the nearest surviving comet to its left that moves right. That's the top of a stack."
  nudge: "Push survivors onto a stack. For a left-mover x: while the top moves right and is smaller than |x|, pop it. If the top moves right and equals |x|, pop it and drop x. If the top moves right and is bigger, drop x. Otherwise push x."
