schema_version: 1
id: plate-stack-check
title: "Plate Stack Check"
topic: stacks-queues
pattern: stack-simulation
tags: [arrays, stack, simulation]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: couldHappen, params: [{ name: washed, type: "int[]" }, { name: served, type: "int[]" }], returns: "bool" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Replay the evening with a real stack. Whenever the plate you need next is on top, is there any reason to wait before taking it?"
  nudge: "Go through washed, pushing each plate. After each push, while the top equals served[j], pop it and move j forward. It could happen exactly when every plate has been popped (j reaches the end)."
