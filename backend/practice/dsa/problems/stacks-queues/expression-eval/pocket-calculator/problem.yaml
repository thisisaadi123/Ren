schema_version: 1
id: pocket-calculator
title: "Pocket Calculator"
topic: stacks-queues
pattern: expression-eval
tags: [stack, math, parsing]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: evaluate, params: [{ name: expr, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Solve the version without parentheses first. What does a `(` ask you to do with the work in progress?"
  nudge: "Evaluate each level like a flat calculator: a stack of terms plus the pending operator. On `(` save (terms, pending operator) on a second stack and start fresh; on `)` sum the inner terms and treat the sum as the next number of the saved level. A leading `-` is just `0 - …`."
