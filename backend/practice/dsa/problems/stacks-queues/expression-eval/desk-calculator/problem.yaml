id: desk-calculator
title: "Desk Calculator"
topic: stacks-queues
pattern: expression-eval
tags: [stack, math, strings]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: calculate, params: [{ name: expr, type: "string" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Multiplication and division have to happen before the additions around them. Can you delay each addition until its whole term is known?"
  nudge: "Keep a stack of terms and the operator seen before the current number. On `+` push the number, on `-` push its negative, on `*` or `/` combine it with the top of the stack. Sum the stack at the end. Truncate division toward zero, even for negative tops."
