hints:
  hint: "Letters can go straight to the output. Operators have to wait: until when?"
  nudge: "Keep a stack of waiting operators. Before pushing a new operator, pop to the output every waiting operator that binds tighter, or equally tight when the new one is left-associative (everything except `^`). `(` is a wall; `)` pops back to its `(`."
