hints:
  hint: "Comparing pieces by value alone is wrong: 9 should beat 34. Which of two pieces should go first?"
  nudge: "Sort with a comparator: a goes before b when str(a) + str(b) > str(b) + str(a). Join them, and return '0' if the result is all zeros."
