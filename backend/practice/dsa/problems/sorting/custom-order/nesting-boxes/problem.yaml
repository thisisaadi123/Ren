hints:
  hint: "Sorting by width reduces it to a one-dimensional problem on heights. But equal widths can't nest: how do you stop them from chaining?"
  nudge: "Sort by width ascending and, for equal widths, height descending. Then the answer is the longest strictly increasing subsequence of heights, found in O(n log n) with patience sorting."
