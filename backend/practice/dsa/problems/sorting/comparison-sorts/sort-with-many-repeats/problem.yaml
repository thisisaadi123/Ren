  hint: "A plain quick sort slows to O(n²) when most values are equal. What if equal values were grouped around the pivot?"
  nudge: "Three-way partitioning: split into < pivot, == pivot and > pivot, and recurse only on the outer two parts. Pick the pivot at random."
