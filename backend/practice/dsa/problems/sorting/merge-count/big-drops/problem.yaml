status: draft
version: 1
kind: function
signature: { function: countBigDrops, params: [{ name: prices, type: "int[]" }], returns: "long" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "This is like counting out-of-order pairs, but the test is prices[i] > 2 · prices[j]. Can merge sort count those before it merges?"
  nudge: "In each merge step, both halves are sorted. Before merging, sweep a pointer through the right half: for each left item x, advance while 2 · right[j] < x, and add j. Then merge as usual. O(n log n)."
