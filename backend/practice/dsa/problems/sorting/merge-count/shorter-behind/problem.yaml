schema_version: 1
id: shorter-behind
title: "Shorter Ones Behind"
topic: sorting
pattern: merge-count
tags: [sorting, merge-sort, divide-and-conquer]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: countShorterBehind, params: [{ name: heights, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "For each person you need the count of shorter people after them. Merge sort brings smaller items forward past larger ones: can you credit the ones they pass?"
  nudge: "Merge sort pairs of (height, index). When you take an item from the left half, every item already taken from the right half is shorter and was behind it, so add that count to its index. O(n log n)."
