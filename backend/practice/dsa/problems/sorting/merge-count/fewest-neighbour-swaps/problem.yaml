hints:
  hint: "Each swap of neighbours fixes exactly one out-of-order pair. So how many swaps do you need?"
  nudge: "The answer is the number of inversions. Count them during merge sort: when you take from the right half, every item still waiting in the left half is larger, so add how many are left."
