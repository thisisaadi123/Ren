schema_version: 1
id: widest-gap-after-sorting
title: "Widest Gap After Sorting"
topic: sorting
pattern: counting-bucket
tags: [sorting, bucket-sort, pigeonhole]
difficulty: hard
status: draft
version: 1
kind: function
signature: { function: widestGap, params: [{ name: nums, type: "int[]" }], returns: "int" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "With n numbers spread between min and max, the widest gap is at least (max - min) / (n - 1). Can buckets that narrow ever hide it inside one bucket?"
  nudge: "Use n - 1 buckets of equal width over [min, max], keeping only each bucket's min and max. The widest gap is between one bucket's max and the next non-empty bucket's min. O(n) time."
