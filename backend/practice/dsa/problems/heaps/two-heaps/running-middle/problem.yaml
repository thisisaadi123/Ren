schema_version: 1
id: running-middle
title: "Running Middle"
topic: heaps
pattern: two-heaps
tags: [heap, two-heaps, data-stream]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: runningMiddle, params: [{ name: readings, type: "int[]" }], returns: "int[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Split the readings seen so far into a lower half and an upper half. The middle sits on the boundary."
  nudge: "Keep a max-heap `low` and a min-heap `high`, with len(low) == len(high) or one more. Push each reading into low, move low's top to high, and if high grew bigger move its top back. The answer is low's top."
