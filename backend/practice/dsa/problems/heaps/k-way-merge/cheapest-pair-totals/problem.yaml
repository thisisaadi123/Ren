schema_version: 1
id: cheapest-pair-totals
title: "Cheapest Pair Totals"
topic: heaps
pattern: k-way-merge
tags: [heap, k-way-merge]
difficulty: medium
status: draft
version: 1
kind: function
signature: { function: cheapestPairs, params: [{ name: a, type: "int[]" }, { name: b, type: "int[]" }, { name: k, type: "int" }], returns: "long[]" }
limits: { time_ms: 1000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Think of row i as a[i] + b[0], a[i] + b[1], …, already sorted. That's many sorted lists: merge their fronts."
  nudge: "Push (a[0] + b[0], 0, 0). Pop the smallest (i, j) k times; after each pop push (i, j + 1), and when j == 0 also (i + 1, 0). This way each pair is pushed once."
authors: [ren]
reviewed_by: []
