schema_version: 1
id: hand-built-heap
title: "Hand-Built Heap"
topic: heaps
pattern: heap-basics
tags: [heap, design]
difficulty: medium
status: draft
version: 1
kind: design
design:
  class: TaskHeap
  constructor: { params: [{ name: items, type: "int[]" }] }
  methods:
    - { name: push, params: [{ name: x, type: "int" }], returns: "void" }
    - { name: pop, params: [], returns: "int" }
    - { name: peek, params: [], returns: "int" }
    - { name: size, params: [], returns: "int" }
limits: { time_ms: 2000, memory_mb: 256 }
checker: { type: exact }
hints:
  hint: "Store the heap in an array: the children of index i are 2i + 1 and 2i + 2. Which way does a new value move, and which way does the last value move after a pop?"
  nudge: "push: append, then sift up while smaller than the parent. pop: swap the root with the last item, remove it, then sift the new root down toward its smaller child. Build from items by sifting down every index from n/2 − 1 to 0, which is O(n)."
authors: [ren]
reviewed_by: []
